    function buildTriangleBufferFromFloat32(triFloat32) {
      if (!triFloat32 || triFloat32.length === 0) return;
      totalTriangles = Math.floor(triFloat32.length / 15);
      const tData = new Float32Array(triFloat32.length);
      tData.set(triFloat32);
      for (let vi = 0; vi < tData.length; vi += 5) {
        tData[vi] -= rtcCenterX;
        tData[vi + 1] -= rtcCenterY;
      }
      triangleBuffer = gl.createBuffer();
      gl.bindBuffer(gl.ARRAY_BUFFER, triangleBuffer);
      gl.bufferData(gl.ARRAY_BUFFER, tData, gl.STATIC_DRAW);
    }

    function buildTriangleBuffer(triangles) {
      if (!triangles || triangles.length === 0) return;
      totalTriangles = Math.floor(triangles.length / 7);
      const tData = new Float32Array(totalTriangles * 15);
      for (let i = 0, vi = 0; i < triangles.length; i += 7) {
        const x1 = triangles[i] - rtcCenterX, y1 = triangles[i+1] - rtcCenterY;
        const x2 = triangles[i+2] - rtcCenterX, y2 = triangles[i+3] - rtcCenterY;
        const x3 = triangles[i+4] - rtcCenterX, y3 = triangles[i+5] - rtcCenterY;
        const c = triangles[i+6];
        const r = ((c >> 16) & 255) / 255.0;
        const g = ((c >> 8) & 255) / 255.0;
        const b = (c & 255) / 255.0;

        tData[vi++] = x1; tData[vi++] = y1; tData[vi++] = r; tData[vi++] = g; tData[vi++] = b;
        tData[vi++] = x2; tData[vi++] = y2; tData[vi++] = r; tData[vi++] = g; tData[vi++] = b;
        tData[vi++] = x3; tData[vi++] = y3; tData[vi++] = r; tData[vi++] = g; tData[vi++] = b;
      }
      triangleBuffer = gl.createBuffer();
      gl.bindBuffer(gl.ARRAY_BUFFER, triangleBuffer);
      gl.bufferData(gl.ARRAY_BUFFER, tData, gl.STATIC_DRAW);
    }

    async function loadCadData() {
      const fileId = urlParams.get('id') || urlParams.get('file');
      const customTitle = urlParams.get('title');

      const titleEl = document.getElementById('project-title');
      if (customTitle) {
        const decodedTitle = decodeURIComponent(customTitle);
        if (titleEl) titleEl.textContent = decodedTitle;
        document.title = `${decodedTitle} - CAD Motoru`;
      } else if (!fileId) {
        if (titleEl) titleEl.textContent = 'HASAN AKTAŞ STATİK PROJESİ';
      }

      updateLoader(1, 'Hızlı CAD Akışı Başlatılıyor', 'DWG vektörleri GPU donanımına hazırlanıyor...', 20);

      let vertexData = null;
      let triBinaryData = null;
      const forceRefresh = urlParams.has('nocache') || urlParams.has('refresh');
      if (fileId) {
        let cached = !forceRefresh ? await getCachedDrawing(fileId) : null;
        if (cached && cached.vertexBuffer) {
          updateLoader(2, 'Önbellekten Anında Yükleme', 'Geometri cihaz belleğinden (0.05sn) aktarılıyor...', 85);
          vertexData = new Float32Array(cached.vertexBuffer);
          if (cached.triBuffer) {
            triBinaryData = new Float32Array(cached.triBuffer);
          }
          bounds = cached.meta.bounds || bounds;
          cadTexts = cached.meta.texts || [];
          totalLines = cached.meta.totalLines || Math.floor(vertexData.length / 10);
          applyDetectedUnits(cached.meta);
          populateLayersUI(cached.meta.layers || []);
          window._pendingTriangles = (!triBinaryData && cached.meta && cached.meta.triangles) ? cached.meta.triangles : null;
          loadedFromBinary = true;
        } else {
          const querySuffix = forceRefresh ? `?nocache=${Date.now()}` : `?v=8.0`;
          const candidateMetaUrls = [
            `/files/${fileId}_cad_meta.json${querySuffix}`,
            `/files/${fileId}_cad_data_meta.json${querySuffix}`
          ];
          const candidateBinUrls = [
            `/files/${fileId}_cad_vertices.bin${querySuffix}`,
            `/files/${fileId}_cad_data_vertices.bin${querySuffix}`
          ];
          const candidateTriBinUrls = [
            `/files/${fileId}_cad_triangles.bin${querySuffix}`,
            `/files/${fileId}_cad_data_triangles.bin${querySuffix}`
          ];
          const candidateJsonUrls = [
            `/files/${fileId}_cad_data.json${querySuffix}`,
            `/files/${fileId}.json${querySuffix}`
          ];
          let attempts = 0;
          const maxAttempts = 90;

          while (attempts < maxAttempts) {
            attempts++;
            try {
              if (attempts > 1) {
                const pct = Math.min(85, 20 + Math.round(attempts * 0.75));
                updateLoader(1, 'Vektör Katmanları İşleniyor', `Büyük CAD projesi çözümleniyor (${attempts}/${maxAttempts})`, pct);
              }

              let foundBinary = false;
              for (let u = 0; u < candidateMetaUrls.length; u++) {
                try {
                  const [metaRes, binRes] = await Promise.all([
                    fetch(candidateMetaUrls[u]),
                    fetch(candidateBinUrls[u])
                  ]);

                  if (metaRes.ok && binRes.ok) {
                    updateLoader(2, 'GPU Doğrudan Akışı', 'İkili geometri paketi GPU belleğine akıtılıyor...', 82);
                    const meta = await metaRes.json();
                    const buf = await binRes.arrayBuffer();

                    vertexData = new Float32Array(buf);
                    bounds = meta.bounds || bounds;
                    cadTexts = meta.texts || [];
                    totalLines = meta.totalLines || Math.floor(vertexData.length / 10);
                    applyDetectedUnits(meta);
                    populateLayersUI(meta.layers || []);

                    if (meta.hasBinaryTriangles && (!meta.triangles || meta.triangles.length === 0)) {
                      try {
                        const triRes = await fetch(candidateTriBinUrls[u]);
                        if (triRes.ok) {
                          const tBuf = await triRes.arrayBuffer();
                          triBinaryData = new Float32Array(tBuf);
                        }
                      } catch (_) {}
                    }
                    window._pendingTriangles = meta.triangles || null;
                    loadedFromBinary = true;
                    setCachedDrawing(fileId, meta, vertexData, triBinaryData ? triBinaryData.buffer : null);
                    foundBinary = true;
                    break;
                  }
                } catch (_) {}
              }

              if (foundBinary) break;

              let foundJson = false;
              for (const jUrl of candidateJsonUrls) {
                try {
                  const jsonRes = await fetch(jUrl);
                  if (jsonRes.ok) {
                    updateLoader(2, 'Vektörler Çözümleniyor', 'Geometri verisi çözümleniyor...', 75);
                    const data = await jsonRes.json();
                    bounds = data.bounds || bounds;
                    cadTexts = data.texts || [];
                    const lines = data.lines || [];
                    totalLines = Math.floor(lines.length / 5);
                    rawLinesArray = lines;
                    applyDetectedUnits(data);
                    populateLayersUI(data.layers || []);
                    window._pendingTriangles = data.triangles || null;

                    vertexData = new Float32Array(totalLines * 10);
                    for (let i = 0, vi = 0; i < lines.length; i += 5) {
                      const x1 = lines[i], y1 = lines[i+1], x2 = lines[i+2], y2 = lines[i+3], c = lines[i+4];
                      const r = ((c >> 16) & 255) / 255, g = ((c >> 8) & 255) / 255, b = (c & 255) / 255;
                      vertexData[vi++] = x1; vertexData[vi++] = y1; vertexData[vi++] = r; vertexData[vi++] = g; vertexData[vi++] = b;
                      vertexData[vi++] = x2; vertexData[vi++] = y2; vertexData[vi++] = r; vertexData[vi++] = g; vertexData[vi++] = b;
                    }
                    setCachedDrawing(fileId, { bounds, texts: cadTexts, totalLines, layers: data.layers, triangles: data.triangles }, vertexData);
                    foundJson = true;
                    break;
                  }
                } catch (_) {}
              }

              if (foundJson) break;

              await new Promise(r => setTimeout(r, 450));
            } catch (e) {
              await new Promise(r => setTimeout(r, 450));
            }
          }
        }
      } else {
        try {
          const [metaRes, binRes] = await Promise.all([
            fetch('/cad_meta.json'),
            fetch('/cad_vertices.bin')
          ]);
          if (metaRes.ok && binRes.ok) {
            updateLoader(2, 'GPU Doğrudan Akışı', 'Varsayılan mimari çizim GPU donanımına aktarılıyor...', 75);
            const meta = await metaRes.json();
            const buf = await binRes.arrayBuffer();
            vertexData = new Float32Array(buf);
            bounds = meta.bounds || bounds;
            cadTexts = meta.texts || [];
            totalLines = meta.totalLines || Math.floor(vertexData.length / 10);
            applyDetectedUnits(meta);
            populateLayersUI(meta.layers || []);
            window._pendingTriangles = meta.triangles || null;
            loadedFromBinary = true;
          } else {
            const res = await fetch('/cad_data.json');
            if (res.ok) {
              updateLoader(2, 'Vektörler Çözümleniyor', 'Varsayılan mimari çizim yükleniyor...', 65);
              const data = await res.json();
              bounds = data.bounds || bounds;
              cadTexts = data.texts || [];
              const lines = data.lines || [];
              totalLines = Math.floor(lines.length / 5);
              rawLinesArray = lines;
              applyDetectedUnits(data);
              populateLayersUI(data.layers || []);
              window._pendingTriangles = data.triangles || null;

              vertexData = new Float32Array(totalLines * 10);
              for (let i = 0, vi = 0; i < lines.length; i += 5) {
                const x1 = lines[i], y1 = lines[i+1], x2 = lines[i+2], y2 = lines[i+3], c = lines[i+4];
                const r = ((c >> 16) & 255) / 255, g = ((c >> 8) & 255) / 255, b = (c & 255) / 255;
                vertexData[vi++] = x1; vertexData[vi++] = y1; vertexData[vi++] = r; vertexData[vi++] = g; vertexData[vi++] = b;
                vertexData[vi++] = x2; vertexData[vi++] = y2; vertexData[vi++] = r; vertexData[vi++] = g; vertexData[vi++] = b;
              }
            }
          }
        } catch (e) {
          console.error(e);
        }
      }

      if (!vertexData || vertexData.length === 0) {
        updateLoader(1, 'Çizim Dosyası Hazırlanıyor', 'Sunucudaki CAD vektör işlemi devam ediyor. Lütfen butona basarak tekrar kontrol edin.', 90);
        let existingBtn = document.getElementById('cad-retry-btn');
        if (!existingBtn) {
          const retryBtn = document.createElement('button');
          retryBtn.id = 'cad-retry-btn';
          retryBtn.className = 'cad-retry-btn';
          retryBtn.textContent = 'Çizimi Tekrar Kontrol Et';
          retryBtn.onclick = () => {
            retryBtn.remove();
            loadCadData();
          };
          if (loader) loader.appendChild(retryBtn);
        }
        return;
      }
      const existingBtn = document.getElementById('cad-retry-btn');
      if (existingBtn) existingBtn.remove();

      updateLoader(3, 'GPU Belleğine Aktarılıyor', `${totalLines.toLocaleString('tr-TR')} çizgi grafik işlemcisine aktarılıyor...`, 88);

      if (loadedFromBinary) {
        rawLinesArray = new Float32Array(totalLines * 5);
        for (let i = 0, vi = 0, ri = 0; i < totalLines; i++, vi += 10, ri += 5) {
          rawLinesArray[ri] = vertexData[vi];
          rawLinesArray[ri+1] = vertexData[vi+1];
          rawLinesArray[ri+2] = vertexData[vi+5];
          rawLinesArray[ri+3] = vertexData[vi+6];
          const r = Math.round(vertexData[vi+2] * 255);
          const g = Math.round(vertexData[vi+3] * 255);
          const b = Math.round(vertexData[vi+4] * 255);
          rawLinesArray[ri+4] = (r << 16) | (g << 8) | b;
        }
      }

      // Aykırı (71663813 vb.) uçuk koordinatları eleyerek gerçek pafta sınırlarını hesapla
      if (rawLinesArray && totalLines > 10) {
        const sampleStep = Math.max(1, Math.floor(totalLines / 8000)) * 5;
        const xs = [], ys = [];
        for (let i = 0; i < rawLinesArray.length; i += sampleStep) {
          const x1 = rawLinesArray[i], y1 = rawLinesArray[i+1];
          const x2 = rawLinesArray[i+2], y2 = rawLinesArray[i+3];
          if (isFinite(x1) && isFinite(y1) && Math.abs(x1) < 1e8 && Math.abs(y1) < 1e8) {
            xs.push(x1); ys.push(y1);
          }
          if (isFinite(x2) && isFinite(y2) && Math.abs(x2) < 1e8 && Math.abs(y2) < 1e8) {
            xs.push(x2); ys.push(y2);
          }
        }
        if (xs.length > 20) {
          xs.sort((a, b) => a - b);
          ys.sort((a, b) => a - b);
          const qMinX = xs[Math.floor(xs.length * 0.02)];
          const qMaxX = xs[Math.floor(xs.length * 0.98)];
          const qMinY = ys[Math.floor(ys.length * 0.02)];
          const qMaxY = ys[Math.floor(ys.length * 0.98)];
          const spanX = Math.max(qMaxX - qMinX, 2000);
          const spanY = Math.max(qMaxY - qMinY, 2000);
          const validMinX = qMinX - Math.max(spanX * 1.5, 100000);
          const validMaxX = qMaxX + Math.max(spanX * 1.5, 100000);
          const validMinY = qMinY - Math.max(spanY * 2.0, 80000);
          const validMaxY = qMaxY + Math.max(spanY * 2.0, 80000);

          let tMinX = Infinity, tMaxX = -Infinity, tMinY = Infinity, tMaxY = -Infinity;
          for (let i = 0; i < rawLinesArray.length; i += 5) {
            const x1 = rawLinesArray[i], y1 = rawLinesArray[i+1];
            const x2 = rawLinesArray[i+2], y2 = rawLinesArray[i+3];
            if (x1 >= validMinX && x1 <= validMaxX && y1 >= validMinY && y1 <= validMaxY &&
                x2 >= validMinX && x2 <= validMaxX && y2 >= validMinY && y2 <= validMaxY) {
              if (x1 < tMinX) tMinX = x1;
              if (x1 > tMaxX) tMaxX = x1;
              if (x2 < tMinX) tMinX = x2;
              if (x2 > tMaxX) tMaxX = x2;
              if (y1 < tMinY) tMinY = y1;
              if (y1 > tMaxY) tMaxY = y1;
              if (y2 < tMinY) tMinY = y2;
              if (y2 > tMaxY) tMaxY = y2;
            }
          }
          if (isFinite(tMinX) && isFinite(tMaxX) && isFinite(tMinY) && isFinite(tMaxY)) {
            bounds = {
              minX: tMinX,
              minY: tMinY,
              w: Math.max(100, tMaxX - tMinX),
              h: Math.max(100, tMaxY - tMinY)
            };
          }
        }
      }

      rtcCenterX = (bounds.minX || 0) + (bounds.w || 0) * 0.5;
      rtcCenterY = (bounds.minY || 0) + (bounds.h || 0) * 0.5;

      const rtcVertexData = new Float32Array(vertexData.length);
      rtcVertexData.set(vertexData);
      for (let vi = 0; vi < rtcVertexData.length; vi += 5) {
        rtcVertexData[vi] -= rtcCenterX;
        rtcVertexData[vi + 1] -= rtcCenterY;
      }

      if (triBinaryData && triBinaryData.length > 0) {
        buildTriangleBufferFromFloat32(triBinaryData);
      } else if (window._pendingTriangles) {
        buildTriangleBuffer(window._pendingTriangles);
      }

      lineBuffer = gl.createBuffer();
      gl.bindBuffer(gl.ARRAY_BUFFER, lineBuffer);
      gl.bufferData(gl.ARRAY_BUFFER, rtcVertexData, gl.STATIC_DRAW);

      const aPos = gl.getAttribLocation(lineProgram, 'a_pos');
      gl.enableVertexAttribArray(aPos);
      gl.vertexAttribPointer(aPos, 2, gl.FLOAT, false, 20, 0);

      const aColor = gl.getAttribLocation(lineProgram, 'a_color');
      gl.enableVertexAttribArray(aColor);
      gl.vertexAttribPointer(aColor, 3, gl.FLOAT, false, 20, 8);

      // Metin mekansal indeksini kur
      buildTextSpatialGrid(cadTexts);

      updateLoader(4, 'Çizim Hazır', 'Görüntü ekrana yerleştiriliyor...', 100);
      setTimeout(() => {
        if (loader) loader.style.display = 'none';
      }, 150);

      const urlParamsNow = new URLSearchParams(window.location.search);
      const paramX = parseFloat(urlParamsNow.get('x'));
      const paramY = parseFloat(urlParamsNow.get('y'));
      const paramZoom = parseFloat(urlParamsNow.get('zoom'));

      if (!isNaN(paramX) && !isNaN(paramY) && !isNaN(paramZoom)) {
        offsetX = paramX;
        offsetY = paramY;
        zoom = paramZoom;
        scheduleRender();
      } else {
        fitToScreen();
      }

      setTimeout(() => {
        buildSpatialGrid(rawLinesArray, 5);
      }, 40);
    }

    function fitToScreen() {
      const w = window.innerWidth;
      const h = window.innerHeight;
      const scaleX = (w * 0.95) / bounds.w;
      const scaleY = (h * 0.95) / bounds.h;
      zoom = Math.min(scaleX, scaleY);
      offsetX = bounds.minX + bounds.w / 2;
      offsetY = bounds.minY + bounds.h / 2;
      scheduleRender();
    }

    function worldToScreen(wx, wy) {
      const logicalW = window.innerWidth;
      const logicalH = window.innerHeight;
      const dy = flipY ? (wy - offsetY) : -(wy - offsetY);
      return {
        x: (wx - offsetX) * zoom + logicalW * 0.5,
        y: dy * zoom + logicalH * 0.5
      };
    }

    function screenToWorld(sx, sy) {
      const logicalW = window.innerWidth;
      const logicalH = window.innerHeight;
      const dy = (sy - logicalH * 0.5) / zoom;
      return {
        x: offsetX + (sx - logicalW * 0.5) / zoom,
        y: flipY ? (offsetY + dy) : (offsetY - dy)
      };
    }

    function render() {
      scheduleRender();
    }

    function renderNow() {
      const dpr = window.devicePixelRatio || 1;
      const screenW = glCanvas.width;
      const screenH = glCanvas.height;
      const logicalW = window.innerWidth;
      const logicalH = window.innerHeight;

      // 1. WebGL Hardware Draw
      gl.clear(gl.COLOR_BUFFER_BIT);

      gl.useProgram(lineProgram);
      const uRes = gl.getUniformLocation(lineProgram, 'u_res');
      const uOffset = gl.getUniformLocation(lineProgram, 'u_offset');
      const uZoom = gl.getUniformLocation(lineProgram, 'u_zoom');
      const uFlipY = gl.getUniformLocation(lineProgram, 'u_flip_y');

      gl.uniform2f(uRes, screenW, screenH);
      gl.uniform2f(uOffset, offsetX - rtcCenterX, offsetY - rtcCenterY);
      gl.uniform1f(uZoom, zoom * dpr);
      gl.uniform1f(uFlipY, flipY ? -1.0 : 1.0);

      const aPos = gl.getAttribLocation(lineProgram, 'a_pos');
      const aColor = gl.getAttribLocation(lineProgram, 'a_color');

      if (showFills && totalTriangles > 0 && triangleBuffer) {
        gl.bindBuffer(gl.ARRAY_BUFFER, triangleBuffer);
        gl.enableVertexAttribArray(aPos);
        gl.vertexAttribPointer(aPos, 2, gl.FLOAT, false, 20, 0);
        gl.enableVertexAttribArray(aColor);
        gl.vertexAttribPointer(aColor, 3, gl.FLOAT, false, 20, 8);
        gl.drawArrays(gl.TRIANGLES, 0, totalTriangles * 3);
      }

      if (totalLines > 0 && lineBuffer) {
        gl.bindBuffer(gl.ARRAY_BUFFER, lineBuffer);
        gl.enableVertexAttribArray(aPos);
        gl.vertexAttribPointer(aPos, 2, gl.FLOAT, false, 20, 0);
        gl.enableVertexAttribArray(aColor);
        gl.vertexAttribPointer(aColor, 3, gl.FLOAT, false, 20, 8);
        gl.drawArrays(gl.LINES, 0, totalLines * 2);
      }

      // 2. Text and Measure Overlay Draw (Spatial Grid Culling + Dynamic LOD)
      textCtx.clearRect(0, 0, textCanvas.width, textCanvas.height);
      textCtx.save();
      textCtx.scale(dpr, dpr);

      if (showTexts && cadTexts.length > 0) {
        textCtx.textBaseline = 'alphabetic';

        const halfW = (logicalW * 0.5) / zoom;
        const halfH = (logicalH * 0.5) / zoom;
        const minVisX = offsetX - halfW - 300;
        const maxVisX = offsetX + halfW + 300;
        const minVisY = offsetY - halfH - 300;
        const maxVisY = offsetY + halfH + 300;

        // Kaydırma esnasında çok küçük yazıları atlayarak 120 FPS akıcılığı koru
        const minFontPx = isInteracting ? 3.5 : 1.4;

        const drawTextItem = (item) => {
          if (item.l && hiddenLayers.has(item.l)) return;
          if (item.x < minVisX || item.x > maxVisX || item.y < minVisY || item.y > maxVisY) return;
          const screenFontSize = Math.min(54.0, item.s * zoom);
          if (screenFontSize < minFontPx) return;

          const sp = worldToScreen(item.x, item.y);
          textCtx.font = `600 ${screenFontSize.toFixed(1)}px 'Poppins', Arial, sans-serif`;
          textCtx.fillStyle = item.c || '#ffffff';
          textCtx.textAlign = (item.a === 1 || item.a === 4) ? 'center' : (item.a === 2 ? 'right' : 'left');

          if (item.r) {
            textCtx.save();
            textCtx.translate(sp.x, sp.y);
            const rotAngle = flipY ? (item.r * Math.PI / 180) : (-item.r * Math.PI / 180);
            textCtx.rotate(rotAngle);
            textCtx.fillText(item.t, 0, 0);
            textCtx.restore();
          } else {
            textCtx.fillText(item.t, sp.x, sp.y);
          }
        };

        const minGx = Math.floor(minVisX / TEXT_GRID_SIZE);
        const maxGx = Math.floor(maxVisX / TEXT_GRID_SIZE);
        const minGy = Math.floor(minVisY / TEXT_GRID_SIZE);
        const maxGy = Math.floor(maxVisY / TEXT_GRID_SIZE);
        const gridSpan = (maxGx - minGx + 1) * (maxGy - minGy + 1);

        if (textSpatialGrid.size > 0 && gridSpan < 250) {
          for (let gx = minGx; gx <= maxGx; gx++) {
            for (let gy = minGy; gy <= maxGy; gy++) {
              const cell = textSpatialGrid.get(`${gx}_${gy}`);
              if (!cell) continue;
              for (let i = 0; i < cell.length; i++) {
                drawTextItem(cell[i]);
              }
            }
          }
        } else {
          for (let i = 0; i < cadTexts.length; i++) {
            drawTextItem(cadTexts[i]);
          }
        }
      }

      renderMeasurements();
      textCtx.restore();

      zoomLevelEl.innerText = `Zoom: ${(zoom * 1000).toFixed(1)}%`;
      updateCoordsDisplay(offsetX, offsetY);
    }

    let currentAimingPos = null;

    function renderMeasurements() {
      if (measureMode === 'none' && measurePoints.length === 0 && !isAiming) return;

      const pts = measurePoints.map(p => worldToScreen(p.x, p.y));

      if (measureMode === 'distance') {
        if (pts.length > 1) {
          textCtx.beginPath();
          textCtx.strokeStyle = '#00f0ff';
          textCtx.lineWidth = 2.5;
          textCtx.setLineDash([8, 5]);
          textCtx.moveTo(pts[0].x, pts[0].y);
          for (let i = 1; i < pts.length; i++) {
            textCtx.lineTo(pts[i].x, pts[i].y);
          }
          textCtx.stroke();
          textCtx.setLineDash([]);

          for (let i = 0; i < measurePoints.length - 1; i++) {
            const p1 = measurePoints[i];
            const p2 = measurePoints[i+1];
            const sp1 = pts[i];
            const sp2 = pts[i+1];

            const dx = p2.x - p1.x;
            const dy = p2.y - p1.y;
            const distWorld = Math.hypot(dx, dy);
            const distMeters = distWorld * metersPerUnit;

            const midX = (sp1.x + sp2.x) * 0.5;
            const midY = (sp1.y + sp2.y) * 0.5;

            drawPillBadge(`${distMeters.toFixed(2)} m`, midX, midY - 14, '#00f0ff', '#083344');
          }
        }

        if (isAiming && currentAimingPos && pts.length > 0) {
          const lastSp = pts[pts.length - 1];
          const aimSp = worldToScreen(currentAimingPos.x, currentAimingPos.y);

          textCtx.beginPath();
          textCtx.strokeStyle = '#f59e0b';
          textCtx.lineWidth = 2.4;
          textCtx.setLineDash([6, 4]);
          textCtx.moveTo(lastSp.x, lastSp.y);
          textCtx.lineTo(aimSp.x, aimSp.y);
          textCtx.stroke();
          textCtx.setLineDash([]);

          const lastP = measurePoints[measurePoints.length - 1];
          const liveDistM = Math.hypot(currentAimingPos.x - lastP.x, currentAimingPos.y - lastP.y) * metersPerUnit;
          const midX = (lastSp.x + aimSp.x) * 0.5;
          const midY = (lastSp.y + aimSp.y) * 0.5;
          drawPillBadge(`${liveDistM.toFixed(2)} m`, midX, midY - 14, '#fbbf24', '#451a03');
        }

        for (let i = 0; i < pts.length; i++) {
          drawHandle(pts[i].x, pts[i].y, i + 1, '#00f0ff');
        }

      } else if (measureMode === 'area') {
        if (pts.length >= 2) {
          textCtx.beginPath();
          textCtx.moveTo(pts[0].x, pts[0].y);
          for (let i = 1; i < pts.length; i++) {
            textCtx.lineTo(pts[i].x, pts[i].y);
          }
          if (pts.length >= 3) {
            textCtx.closePath();
            textCtx.fillStyle = 'rgba(16, 185, 129, 0.28)';
            textCtx.fill();
          }
          textCtx.strokeStyle = '#10b981';
          textCtx.lineWidth = 2.5;
          textCtx.setLineDash([8, 4]);
          textCtx.stroke();
          textCtx.setLineDash([]);

          if (pts.length >= 3) {
            const areaM2 = calculateShoelaceArea(measurePoints) * (metersPerUnit * metersPerUnit);
            const perimeterM = calculatePerimeter(measurePoints) * metersPerUnit;

            const cx = pts.reduce((s, p) => s + p.x, 0) / pts.length;
            const cy = pts.reduce((s, p) => s + p.y, 0) / pts.length;

            drawPillBadge(`Alan: ${areaM2.toFixed(2)} m²`, cx, cy - 10, '#34d399', '#064e3b');
            drawPillBadge(`Çevre: ${perimeterM.toFixed(2)} m`, cx, cy + 14, '#a7f3d0', '#064e3b');
          }
        }

        if (isAiming && currentAimingPos && pts.length > 0) {
          const lastSp = pts[pts.length - 1];
          const aimSp = worldToScreen(currentAimingPos.x, currentAimingPos.y);

          textCtx.beginPath();
          textCtx.strokeStyle = '#34d399';
          textCtx.lineWidth = 2.2;
          textCtx.setLineDash([6, 4]);
          textCtx.moveTo(lastSp.x, lastSp.y);
          textCtx.lineTo(aimSp.x, aimSp.y);
          if (pts.length >= 2) {
            textCtx.lineTo(pts[0].x, pts[0].y);
          }
          textCtx.stroke();
          textCtx.setLineDash([]);
        }

        for (let i = 0; i < pts.length; i++) {
          drawHandle(pts[i].x, pts[i].y, i + 1, '#10b981');
        }
      }

      if (isAiming && currentAimingPos) {
        const sp = worldToScreen(currentAimingPos.x, currentAimingPos.y);
        textCtx.save();
        if (activeSnapPoint && activeSnapPoint.type && activeSnapPoint.type.includes('ÇİZGİ')) {
          textCtx.strokeStyle = '#00f0ff';
          textCtx.lineWidth = 2.4;
          textCtx.beginPath();
          textCtx.moveTo(sp.x - 8, sp.y - 8); textCtx.lineTo(sp.x + 8, sp.y + 8);
          textCtx.moveTo(sp.x - 8, sp.y + 8); textCtx.lineTo(sp.x + 8, sp.y - 8);
          textCtx.stroke();
          drawPillBadge('ÇİZGİ HATTI', sp.x, sp.y - 20, '#00f0ff', '#083344');
        } else if (activeSnapPoint && activeSnapPoint.type && activeSnapPoint.type.includes('ORTA')) {
          textCtx.strokeStyle = '#38bdf8';
          textCtx.lineWidth = 2.4;
          textCtx.beginPath();
          textCtx.moveTo(sp.x, sp.y - 9);
          textCtx.lineTo(sp.x + 8, sp.y + 6);
          textCtx.lineTo(sp.x - 8, sp.y + 6);
          textCtx.closePath();
          textCtx.stroke();
          drawPillBadge('ORTA NOKTA', sp.x, sp.y - 20, '#38bdf8', '#082f49');
        } else if (activeSnapPoint && activeSnapPoint.type && activeSnapPoint.type.includes('AKS')) {
          textCtx.strokeStyle = '#f59e0b';
          textCtx.lineWidth = 2;
          textCtx.beginPath();
          textCtx.arc(sp.x, sp.y, 9, 0, Math.PI * 2);
          textCtx.stroke();
          drawPillBadge(activeSnapPoint.type, sp.x, sp.y - 20, '#f59e0b', '#451a03');
        } else if (activeSnapPoint) {
          textCtx.strokeStyle = '#22c55e';
          textCtx.lineWidth = 2.5;
          textCtx.strokeRect(sp.x - 8, sp.y - 8, 16, 16);
          textCtx.fillStyle = 'rgba(34, 197, 94, 0.4)';
          textCtx.fillRect(sp.x - 8, sp.y - 8, 16, 16);
          drawPillBadge(activeSnapPoint.type || 'KÖŞE', sp.x, sp.y - 20, '#22c55e', '#052e16');
        } else {
          textCtx.strokeStyle = '#ffffff';
          textCtx.lineWidth = 1.8;
          textCtx.beginPath();
          textCtx.arc(sp.x, sp.y, 6, 0, Math.PI * 2);
          textCtx.stroke();
        }
        textCtx.restore();
      }
    }

    function drawHandle(x, y, index, color) {
      textCtx.save();
      textCtx.beginPath();
      textCtx.arc(x, y, 7, 0, Math.PI * 2);
      textCtx.fillStyle = color;
      textCtx.shadowColor = color;
      textCtx.shadowBlur = 8;
      textCtx.fill();

      textCtx.beginPath();
      textCtx.arc(x, y, 3, 0, Math.PI * 2);
      textCtx.fillStyle = '#ffffff';
      textCtx.fill();
      textCtx.restore();
    }

    function drawPillBadge(text, x, y, textColor, bgColor) {
      textCtx.save();
      textCtx.font = 'bold 11px -apple-system, sans-serif';
      const textW = textCtx.measureText(text).width;
      const padX = 8;
      const boxW = textW + padX * 2;
      const boxH = 18;

      textCtx.fillStyle = bgColor;
      textCtx.strokeStyle = textColor;
      textCtx.lineWidth = 1.2;
      textCtx.beginPath();
      textCtx.roundRect(x - boxW * 0.5, y - boxH * 0.5, boxW, boxH, 6);
      textCtx.fill();
      textCtx.stroke();

      textCtx.fillStyle = textColor;
      textCtx.textAlign = 'center';
      textCtx.textBaseline = 'middle';
      textCtx.fillText(text, x, y);
      textCtx.restore();
    }

    function calculateShoelaceArea(points) {
      if (points.length < 3) return 0;
      let area = 0;
      const n = points.length;
      for (let i = 0; i < n; i++) {
        const j = (i + 1) % n;
        area += points[i].x * points[j].y;
        area -= points[j].x * points[i].y;
      }
      return Math.abs(area) * 0.5;
    }

    function calculatePerimeter(points) {
      if (points.length < 2) return 0;
      let perim = 0;
      for (let i = 0; i < points.length; i++) {
        const next = points[(i + 1) % points.length];
        perim += Math.hypot(next.x - points[i].x, next.y - points[i].y);
      }
      return perim;
    }

    function updateMeasureCardUI() {
      if (measureMode === 'none') {
        measureCard.style.display = 'none';
        return;
      }
      measureCard.style.display = 'flex';

      const cardIcon = document.getElementById('measure-card-icon');

      if (measureMode === 'distance') {
        measureCardTitle.innerText = 'Mesafe Ölçümü';
        if (cardIcon) {
          cardIcon.innerHTML = `<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#00f0ff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21.3 15.3a2.4 2.4 0 0 1 0 3.4l-2.6 2.6a2.4 2.4 0 0 1-3.4 0L2.7 8.7a2.4 2.4 0 0 1 0-3.4l2.6-2.6a2.4 2.4 0 0 1 3.4 0Z"/><path d="m14.5 12.5 2-2"/></svg>`;
        }
        if (measurePoints.length >= 2) {
          let totalWorld = 0;
          for (let i = 0; i < measurePoints.length - 1; i++) {
            totalWorld += Math.hypot(measurePoints[i+1].x - measurePoints[i].x, measurePoints[i+1].y - measurePoints[i].y);
          }
          const totalM = totalWorld * metersPerUnit;
          measurePrimaryVal.innerText = `${totalM.toFixed(2)} m`;
          measureSubVal.innerText = `${measurePoints.length} nokta • Ölçü için basılı tutun`;
        } else if (measurePoints.length === 1) {
          measurePrimaryVal.innerText = '0.00 m';
          measureSubVal.innerText = '2. nokta için basılı tutun • Kaydırmak için sürükleyin';
        } else {
          measurePrimaryVal.innerText = '0.00 m';
          measureSubVal.innerText = 'Başlangıç için basılı tutun • Kaydırmak için sürükleyin';
        }
      } else if (measureMode === 'area') {
        measureCardTitle.innerText = 'Alan Hesaplama';
        if (cardIcon) {
          cardIcon.innerHTML = `<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#10b981" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2 2 7l4 12h12l4-12Z"/></svg>`;
        }
        if (measurePoints.length >= 3) {
          const areaM2 = calculateShoelaceArea(measurePoints) * (metersPerUnit * metersPerUnit);
          const perimM = calculatePerimeter(measurePoints) * metersPerUnit;
          measurePrimaryVal.innerText = `${areaM2.toFixed(2)} m²`;
          measureSubVal.innerText = `Çevre: ${perimM.toFixed(2)} m • ${measurePoints.length} köşe`;
        } else {
          measurePrimaryVal.innerText = '0.00 m²';
          measureSubVal.innerText = `${measurePoints.length}/3 köşe • Basılı tutarak köşe seçin`;
        }
      }
    }

    function renderLoupe(screenX, screenY, worldX, worldY) {
      loupeContainer.style.display = 'block';

      let loupeLeft = Math.max(75, Math.min(window.innerWidth - 75, screenX));
      let loupeTop = screenY - 95;
      if (loupeTop < 75) {
        loupeTop = screenY + 95;
      }
      loupeContainer.style.left = `${loupeLeft}px`;
      loupeContainer.style.top = `${loupeTop}px`;

      loupeCtx.fillStyle = '#000000';
      loupeCtx.fillRect(0, 0, 160, 160);

      if (!rawLinesArray) return;

      const loupeZoom = Math.max(zoom * 3.5, 0.04);
      const lcx = 80;
      const lcy = 80;

      const halfLoupeWorldW = lcx / loupeZoom;
      const halfLoupeWorldH = lcy / loupeZoom;
      const minX = worldX - halfLoupeWorldW;
      const maxX = worldX + halfLoupeWorldW;
      const minY = worldY - halfLoupeWorldH;
      const maxY = worldY + halfLoupeWorldH;

      loupeCtx.lineWidth = 2.0;
      const lines = rawLinesArray;
      const len = lines.length;

      const drawLoupeSegment = (i) => {
        const x1 = lines[i];
        const y1 = lines[i+1];
        const x2 = lines[i+2];
        const y2 = lines[i+3];

        if ((x1 < minX && x2 < minX) || (x1 > maxX && x2 > maxX)) return;
        if ((y1 < minY && y2 < minY) || (y1 > maxY && y2 > maxY)) return;

        const colorInt = lines[i+4];
        loupeCtx.strokeStyle = `#${(colorInt & 0xffffff).toString(16).padStart(6, '0')}`;

        const sx1 = (x1 - worldX) * loupeZoom + lcx;
        const dy1 = flipY ? (y1 - worldY) : -(y1 - worldY);
        const sy1 = dy1 * loupeZoom + lcy;

        const sx2 = (x2 - worldX) * loupeZoom + lcx;
        const dy2 = flipY ? (y2 - worldY) : -(y2 - worldY);
        const sy2 = dy2 * loupeZoom + lcy;

        loupeCtx.beginPath();
        loupeCtx.moveTo(sx1, sy1);
        loupeCtx.lineTo(sx2, sy2);
        loupeCtx.stroke();
      };

      if (spatialGrid.size > 0) {
        const minGx = Math.floor(minX / GRID_SIZE);
        const maxGx = Math.floor(maxX / GRID_SIZE);
        const minGy = Math.floor(minY / GRID_SIZE);
        const maxGy = Math.floor(maxY / GRID_SIZE);
        const drawnLines = new Set();
        for (let gx = minGx; gx <= maxGx; gx++) {
          for (let gy = minGy; gy <= maxGy; gy++) {
            const cell = spatialGrid.get(`${gx}_${gy}`);
            if (!cell) continue;
            for (let k = 0; k < cell.lines.length; k++) {
              const li = cell.lines[k];
              if (drawnLines.has(li)) continue;
              drawnLines.add(li);
              drawLoupeSegment(li);
            }
          }
        }
      } else {
        for (let i = 0; i < len; i += 5) {
          drawLoupeSegment(i);
        }
      }

      if (showTexts && cadTexts && cadTexts.length > 0) {
        loupeCtx.save();
        loupeCtx.textBaseline = 'alphabetic';
        for (let i = 0; i < cadTexts.length; i++) {
          const item = cadTexts[i];
          if (item.x < minX || item.x > maxX || item.y < minY || item.y > maxY) continue;
          const fs = Math.max(item.s * loupeZoom, 7);
          loupeCtx.font = `600 ${fs.toFixed(1)}px 'Poppins', Arial, sans-serif`;
          loupeCtx.fillStyle = item.c || '#ffffff';
          loupeCtx.textAlign = (item.a === 1 || item.a === 4) ? 'center' : (item.a === 2 ? 'right' : 'left');
          const sx = (item.x - worldX) * loupeZoom + lcx;
          const dy = flipY ? (item.y - worldY) : -(item.y - worldY);
          const sy = dy * loupeZoom + lcy;
          if (item.r) {
            loupeCtx.save();
            loupeCtx.translate(sx, sy);
            const rot = flipY ? (item.r * Math.PI / 180) : (-item.r * Math.PI / 180);
            loupeCtx.rotate(rot);
            loupeCtx.fillText(item.t, 0, 0);
            loupeCtx.restore();
          } else {
            loupeCtx.fillText(item.t, sx, sy);
          }
        }
        loupeCtx.restore();
      }

      if (measurePoints.length > 0) {
        const lastP = measurePoints[measurePoints.length - 1];
        const sx = (lastP.x - worldX) * loupeZoom + lcx;
        const dy = flipY ? (lastP.y - worldY) : -(lastP.y - worldY);
        const sy = dy * loupeZoom + lcy;
        loupeCtx.save();
        loupeCtx.beginPath();
        loupeCtx.moveTo(sx, sy);
        loupeCtx.lineTo(lcx, lcy);
        loupeCtx.strokeStyle = '#f59e0b';
        loupeCtx.lineWidth = 2.2;
        loupeCtx.setLineDash([4, 3]);
        loupeCtx.stroke();
        loupeCtx.restore();
      }

      for (const p of measurePoints) {
        const sx = (p.x - worldX) * loupeZoom + lcx;
        const dy = flipY ? (p.y - worldY) : -(p.y - worldY);
        const sy = dy * loupeZoom + lcy;
        loupeCtx.beginPath();
        loupeCtx.arc(sx, sy, 5, 0, Math.PI * 2);
        loupeCtx.fillStyle = '#00f0ff';
        loupeCtx.fill();
      }

      if (activeSnapPoint) {
        loupeSnapBadge.style.display = 'block';
        loupeSnapBadge.innerText = activeSnapPoint.type || 'KÖŞE';
        if (activeSnapPoint.type && activeSnapPoint.type.includes('ÇİZGİ')) {
          loupeSnapBadge.style.background = 'rgba(6, 182, 212, 0.95)';
        } else if (activeSnapPoint.type && activeSnapPoint.type.includes('ORTA')) {
          loupeSnapBadge.style.background = 'rgba(59, 130, 246, 0.95)';
        } else if (activeSnapPoint.type && activeSnapPoint.type.includes('AKS')) {
          loupeSnapBadge.style.background = 'rgba(245, 158, 11, 0.95)';
        } else {
          loupeSnapBadge.style.background = 'rgba(16, 185, 129, 0.95)';
        }

        const sx = (activeSnapPoint.x - worldX) * loupeZoom + lcx;
        const dy = flipY ? (activeSnapPoint.y - worldY) : -(activeSnapPoint.y - worldY);
        const sy = dy * loupeZoom + lcy;

        loupeCtx.save();
        if (activeSnapPoint.type && activeSnapPoint.type.includes('ÇİZGİ')) {
          loupeCtx.strokeStyle = '#00f0ff';
          loupeCtx.lineWidth = 2.4;
          loupeCtx.beginPath();
          loupeCtx.moveTo(sx - 7, sy - 7); loupeCtx.lineTo(sx + 7, sy + 7);
          loupeCtx.moveTo(sx - 7, sy + 7); loupeCtx.lineTo(sx + 7, sy - 7);
          loupeCtx.stroke();
        } else if (activeSnapPoint.type && activeSnapPoint.type.includes('ORTA')) {
          loupeCtx.strokeStyle = '#38bdf8';
          loupeCtx.lineWidth = 2.4;
          loupeCtx.beginPath();
          loupeCtx.moveTo(sx, sy - 8);
          loupeCtx.lineTo(sx + 7, sy + 6);
          loupeCtx.lineTo(sx - 7, sy + 6);
          loupeCtx.closePath();
          loupeCtx.stroke();
        } else if (activeSnapPoint.type && activeSnapPoint.type.includes('AKS')) {
          loupeCtx.strokeStyle = '#f59e0b';
          loupeCtx.lineWidth = 2;
          loupeCtx.beginPath();
          loupeCtx.arc(sx, sy, 8, 0, Math.PI * 2);
          loupeCtx.stroke();
        } else {
          loupeCtx.strokeStyle = '#22c55e';
          loupeCtx.lineWidth = 2.4;
          loupeCtx.strokeRect(sx - 8, sy - 8, 16, 16);
        }
        loupeCtx.restore();
      } else {
        loupeSnapBadge.style.display = 'none';
      }
    }

    function hideLoupe() {
      loupeContainer.style.display = 'none';
      activeSnapPoint = null;
      currentAimingPos = null;
    }

    let isAiming = false;
    let holdTimer = null;
    let isDragging = false;
    let dragStartX = 0, dragStartY = 0;
    let initialZoom = 1;
    let initialDist = 0;
    const activeTouches = new Map();
    let hasMovedFar = false;

    container.addEventListener('pointerdown', (e) => {
      container.setPointerCapture(e.pointerId);
      activeTouches.set(e.pointerId, { x: e.clientX, y: e.clientY });

      if (activeTouches.size === 1) {
        dragStartX = e.clientX;
        dragStartY = e.clientY;
        hasMovedFar = false;
        isDragging = true;
        isAiming = false;

        if (measureMode !== 'none') {
          clearTimeout(holdTimer);
          holdTimer = setTimeout(() => {
            if (activeTouches.size === 1 && !hasMovedFar) {
              isAiming = true;
              if (navigator.vibrate) navigator.vibrate(22);
              const wp = screenToWorld(dragStartX, dragStartY);
              activeSnapPoint = findNearestSnap(wp.x, wp.y);
              currentAimingPos = activeSnapPoint || wp;
              renderLoupe(dragStartX, dragStartY, currentAimingPos.x, currentAimingPos.y);
              scheduleRender();
            }
          }, 240);
        }
      } else if (activeTouches.size >= 2) {
        clearTimeout(holdTimer);
        isAiming = false;
        isDragging = false;
        hideLoupe();

        const pts = Array.from(activeTouches.values());
        initialDist = Math.hypot(pts[0].x - pts[1].x, pts[0].y - pts[1].y);
        initialZoom = zoom;
      }
    });

    container.addEventListener('pointermove', (e) => {
      if (!activeTouches.has(e.pointerId)) return;
      activeTouches.set(e.pointerId, { x: e.clientX, y: e.clientY });

      if (activeTouches.size >= 2) {
        clearTimeout(holdTimer);
        isAiming = false;
        hideLoupe();

        const pts = Array.from(activeTouches.values());
        const currentDist = Math.hypot(pts[0].x - pts[1].x, pts[0].y - pts[1].y);
        const currentMid = {
          x: (pts[0].x + pts[1].x) * 0.5,
          y: (pts[0].y + pts[1].y) * 0.5
        };

        if (initialDist > 8 && currentDist > 8) {
          const factor = currentDist / initialDist;
          const logicalW = window.innerWidth;
          const logicalH = window.innerHeight;

          const worldMid = screenToWorld(currentMid.x, currentMid.y);
          zoom = Math.max(0.00005, Math.min(zoom * factor, 50.0));
          offsetX = worldMid.x - (currentMid.x - logicalW * 0.5) / zoom;
          const dy = (currentMid.y - logicalH * 0.5) / zoom;
          offsetY = flipY ? (worldMid.y - dy) : (worldMid.y + dy);

          initialDist = currentDist;
          markInteracting();
          scheduleRender();
        }
        return;
      }

      const wp = screenToWorld(e.clientX, e.clientY);
      if (isAiming && currentAimingPos) {
        updateCoordsDisplay(currentAimingPos.x, currentAimingPos.y);
      } else {
        updateCoordsDisplay(wp.x, wp.y);
      }

      if (activeTouches.size === 1 && isDragging) {
        const dx = e.clientX - dragStartX;
        const dy = e.clientY - dragStartY;

        if (measureMode !== 'none') {
          if (isAiming) {
            const prevSnapType = activeSnapPoint ? activeSnapPoint.type : null;
            activeSnapPoint = findNearestSnap(wp.x, wp.y);
            currentAimingPos = activeSnapPoint || wp;

            if (activeSnapPoint && activeSnapPoint.type !== prevSnapType) {
              if (navigator.vibrate) navigator.vibrate(15);
            }

            renderLoupe(e.clientX, e.clientY, currentAimingPos.x, currentAimingPos.y);
            scheduleRender();
          } else {
            if (Math.hypot(dx, dy) > 12) {
              hasMovedFar = true;
              clearTimeout(holdTimer);

              dragStartX = e.clientX;
              dragStartY = e.clientY;
              offsetX -= dx / zoom;
              if (flipY) {
                offsetY -= dy / zoom;
              } else {
                offsetY += dy / zoom;
              }
              markInteracting();
              scheduleRender();
            }
          }
        } else {
          dragStartX = e.clientX;
          dragStartY = e.clientY;
          offsetX -= dx / zoom;
          if (flipY) {
            offsetY -= dy / zoom;
          } else {
            offsetY += dy / zoom;
          }
          markInteracting();
          scheduleRender();
        }
      }
    });

    container.addEventListener('mousemove', (e) => {
      if (!isDragging && !isAiming) {
        const wp = screenToWorld(e.clientX, e.clientY);
        updateCoordsDisplay(wp.x, wp.y);
      }
    });

    function endPointer(e) {
      clearTimeout(holdTimer);

      if (activeTouches.has(e.pointerId)) {
        if (measureMode !== 'none' && activeTouches.size === 1) {
          if (isAiming) {
            if (navigator.vibrate) navigator.vibrate(28);
            const finalPoint = currentAimingPos || activeSnapPoint || screenToWorld(e.clientX, e.clientY);
            measurePoints.push({ x: finalPoint.x, y: finalPoint.y });
            updateMeasureCardUI();
            scheduleRender();
          }
        }
      }

      isAiming = false;
      currentAimingPos = null;
      hideLoupe();
      activeTouches.delete(e.pointerId);

      if (activeTouches.size === 0) {
        isDragging = false;
      } else if (activeTouches.size === 1) {
        const remaining = Array.from(activeTouches.values())[0];
        isDragging = true;
        dragStartX = remaining.x;
        dragStartY = remaining.y;
      }
    }

    container.addEventListener('pointerup', endPointer);
    container.addEventListener('pointercancel', endPointer);

    container.addEventListener('wheel', (e) => {
      e.preventDefault();
      const logicalW = window.innerWidth;
      const logicalH = window.innerHeight;

      const cursorWorld = screenToWorld(e.clientX, e.clientY);
      const zoomFactor = e.deltaY < 0 ? 1.25 : 0.8;
      zoom = Math.max(0.00005, Math.min(zoom * zoomFactor, 50.0));

      offsetX = cursorWorld.x - (e.clientX - logicalW * 0.5) / zoom;
      const dy = (e.clientY - logicalH * 0.5) / zoom;
      offsetY = flipY ? (cursorWorld.y - dy) : (cursorWorld.y + dy);

      markInteracting();
      scheduleRender();
    }, { passive: false });

    const toolsMenuBtn = document.getElementById('tools-menu-btn');
    const toolsPopup = document.getElementById('tools-popup');
    const layersMenuBtn = document.getElementById('layers-menu-btn');
    const layersPopup = document.getElementById('layers-popup');
    const activeModeDot = document.getElementById('active-mode-dot');
    const btnDist = document.getElementById('btn-measure-dist');
    const btnArea = document.getElementById('btn-measure-area');
    const pillDist = document.getElementById('pill-dist');
    const pillArea = document.getElementById('pill-area');
    const pillTexts = document.getElementById('pill-texts');

    toolsMenuBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      const isHidden = toolsPopup.style.display === 'none' || !toolsPopup.style.display;
      toolsPopup.style.display = isHidden ? 'flex' : 'none';
      if (layersPopup) layersPopup.style.display = 'none';
    });

    if (layersMenuBtn) {
      layersMenuBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        const isHidden = layersPopup.style.display === 'none' || !layersPopup.style.display;
        layersPopup.style.display = isHidden ? 'flex' : 'none';
        toolsPopup.style.display = 'none';
      });
    }

    const btnToggleAllLayers = document.getElementById('btn-toggle-all-layers');
    if (btnToggleAllLayers) {
      btnToggleAllLayers.addEventListener('click', (e) => {
        e.stopPropagation();
        const hideAll = hiddenLayers.size === 0;
        hiddenLayers.clear();
        if (hideAll) {
          cadLayers.forEach(l => hiddenLayers.add(l.name));
        }
        document.querySelectorAll('#layers-list-container .popup-item').forEach(el => {
          el.style.opacity = hideAll ? '0.38' : '1';
        });
        scheduleRender();
      });
    }

    document.addEventListener('click', (e) => {
      if (toolsPopup && !toolsPopup.contains(e.target) && !toolsMenuBtn.contains(e.target)) {
        toolsPopup.style.display = 'none';
      }
      if (layersPopup && !layersPopup.contains(e.target) && (!layersMenuBtn || !layersMenuBtn.contains(e.target))) {
        layersPopup.style.display = 'none';
      }
    });

    const measureInfoModal = document.getElementById('measure-info-modal');
    const infoModalIcon = document.getElementById('info-modal-icon');
    const infoModalTitle = document.getElementById('info-modal-title');
    const infoModalBody = document.getElementById('info-modal-body');
    const btnInfoModalOk = document.getElementById('btn-info-modal-ok');
    const btnInfoModalClose = document.getElementById('btn-info-modal-close');

    function closeMeasureTutorial() {
      if (measureInfoModal) {
        measureInfoModal.style.display = 'none';
      }
    }

    if (btnInfoModalOk) btnInfoModalOk.addEventListener('click', closeMeasureTutorial);
    if (btnInfoModalClose) btnInfoModalClose.addEventListener('click', closeMeasureTutorial);

    function showMeasureTutorial(mode) {
      if (!measureInfoModal) return;
      if (mode === 'distance') {
        if (infoModalIcon) infoModalIcon.innerText = '📐';
        if (infoModalTitle) infoModalTitle.innerText = 'Mesafe Ölçümü';
        if (infoModalBody) {
          infoModalBody.innerHTML = `
            <div class="info-tip-row">
              <span class="info-tip-icon">①</span>
              <span>Başlangıç noktasını seçmek için <b>basılı tutun</b>; büyüteçle hizalayıp parmağınızı bırakın.</span>
            </div>
            <div class="info-tip-row">
              <span class="info-tip-icon">②</span>
              <span>İkinci noktayı da aynı şekilde yerleştirin. Mesafe otomatik hesaplanır.</span>
            </div>
            <div class="info-tip-row">
              <span class="info-tip-icon">③</span>
              <span>Çizimi gezinmek ve kaydırmak için ekranda serbestçe sürükleyin.</span>
            </div>
          `;
        }
        measureInfoModal.style.display = 'block';
      } else if (mode === 'area') {
        if (infoModalIcon) infoModalIcon.innerText = '⬡';
        if (infoModalTitle) infoModalTitle.innerText = 'Alan Hesaplama';
        if (infoModalBody) {
          infoModalBody.innerHTML = `
            <div class="info-tip-row">
              <span class="info-tip-icon">①</span>
              <span>Alanın köşe noktalarını sırayla <b>basılı tutarak</b> büyüteç yardımıyla seçin.</span>
            </div>
            <div class="info-tip-row">
              <span class="info-tip-icon">②</span>
              <span>En az 3 nokta eklediğinizde poligon alanı (m²) ve çevre canlı hesaplanır.</span>
            </div>
            <div class="info-tip-row">
              <span class="info-tip-icon">③</span>
              <span>Hatalı eklenen son noktayı 'Geri Al' butonuyla silebilirsiniz.</span>
            </div>
          `;
        }
        measureInfoModal.style.display = 'block';
      }
    }

    function setMeasureMode(newMode) {
      if (measureMode === newMode) {
        measureMode = 'none';
        closeMeasureTutorial();
      } else {
        measureMode = newMode;
        if (measureMode === 'distance' || measureMode === 'area') {
          showMeasureTutorial(measureMode);
        } else {
          closeMeasureTutorial();
        }
      }
      measurePoints = [];
      activeSnapPoint = null;
      hideLoupe();

      btnDist.classList.toggle('item-active', measureMode === 'distance');
      btnArea.classList.toggle('item-active', measureMode === 'area');

      pillDist.innerText = measureMode === 'distance' ? 'Açık' : 'Kapalı';
      pillDist.className = 'status-pill' + (measureMode === 'distance' ? ' active-pill' : '');

      pillArea.innerText = measureMode === 'area' ? 'Açık' : 'Kapalı';
      pillArea.className = 'status-pill' + (measureMode === 'area' ? ' active-pill-green' : '');

      toolsMenuBtn.classList.toggle('active-dist', measureMode === 'distance');
      toolsMenuBtn.classList.toggle('active-area', measureMode === 'area');
      activeModeDot.style.display = measureMode !== 'none' ? 'block' : 'none';
      activeModeDot.style.background = measureMode === 'area' ? '#10b981' : '#00f0ff';
      activeModeDot.style.boxShadow = measureMode === 'area' ? '0 0 8px #10b981' : '0 0 8px #00f0ff';

      container.classList.toggle('crosshair-cursor', measureMode !== 'none');
      toolsPopup.style.display = 'none';

      updateMeasureCardUI();
      scheduleRender();
    }

    btnDist.addEventListener('click', (e) => {
      e.stopPropagation();
      setMeasureMode('distance');
    });

    btnArea.addEventListener('click', (e) => {
      e.stopPropagation();
      setMeasureMode('area');
    });

    document.getElementById('toggle-texts').addEventListener('click', (e) => {
      e.stopPropagation();
      showTexts = !showTexts;
      pillTexts.innerText = showTexts ? 'Açık' : 'Kapalı';
      pillTexts.className = 'status-pill' + (showTexts ? ' active-pill' : '');
      scheduleRender();
    });

    const pillFills = document.getElementById('pill-fills');
    const toggleFillsBtn = document.getElementById('toggle-fills');
    if (toggleFillsBtn) {
      toggleFillsBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        showFills = !showFills;
        if (pillFills) {
          pillFills.innerText = showFills ? 'Açık' : 'Kapalı';
          pillFills.className = 'status-pill' + (showFills ? ' active-pill' : '');
        }
        scheduleRender();
      });
    }

    document.getElementById('btn-measure-close').addEventListener('click', () => {
      setMeasureMode('none');
    });

    document.getElementById('btn-measure-clear').addEventListener('click', () => {
      measurePoints = [];
      updateMeasureCardUI();
      scheduleRender();
    });

    document.getElementById('btn-measure-undo').addEventListener('click', () => {
      if (measurePoints.length > 0) {
        measurePoints.pop();
        updateMeasureCardUI();
        scheduleRender();
      }
    });

    scaleSelect.addEventListener('change', (e) => {
      metersPerUnit = parseFloat(e.target.value) || 0.01;
      updateMeasureCardUI();
      scheduleRender();
    });

    const btnToggleY = document.getElementById('btn-toggle-y');
    const pillYAxis = document.getElementById('pill-y-axis');
    const btnSwapXY = document.getElementById('btn-swap-xy');
    const pillSwapXY = document.getElementById('pill-swap-xy');

    function updateAxisPills() {
      if (pillYAxis) {
        pillYAxis.innerText = flipY ? 'Kuzey ↑' : 'Ters ↓';
        pillYAxis.className = 'status-pill' + (flipY ? ' active-pill' : '');
      }
      if (pillSwapXY) {
        pillSwapXY.innerText = swapXY ? 'Aktif (Y,X)' : 'Standart (X,Y)';
        pillSwapXY.className = 'status-pill' + (swapXY ? ' active-pill-green' : '');
      }
    }
    updateAxisPills();

    if (btnToggleY) {
      btnToggleY.addEventListener('click', (e) => {
        e.stopPropagation();
        flipY = !flipY;
        localStorage.setItem('cad_flip_y', flipY);
        updateAxisPills();
        scheduleRender();
      });
    }

    if (btnSwapXY) {
      btnSwapXY.addEventListener('click', (e) => {
        e.stopPropagation();
        swapXY = !swapXY;
        localStorage.setItem('cad_swap_xy', swapXY);
        updateAxisPills();
        scheduleRender();
      });
    }

    const btnForceReload = document.getElementById('btn-force-reload');
    if (btnForceReload) {
      btnForceReload.addEventListener('click', async (e) => {
        e.stopPropagation();
        if (confirm('Telefondaki çizim önbelleği temizlenip en güncel tarama ve dolgular sunucudan canlı indirilsin mi?')) {
          try {
            const db = await openCadDb();
            if (db) {
              db.close();
              indexedDB.deleteDatabase('CadFastCacheDB');
            }
            localStorage.clear();
          } catch (err) {}
          const url = new URL(window.location.href);
          url.searchParams.set('nocache', Date.now());
          window.location.href = url.toString();
        }
      });
    }

    document.getElementById('zoom-in').addEventListener('click', () => {
      zoom *= 1.4;
      scheduleRender();
    });
    document.getElementById('zoom-out').addEventListener('click', () => {
      zoom /= 1.4;
      scheduleRender();
    });
    const fitBtnEl = document.getElementById('fit-btn');
    if (fitBtnEl) fitBtnEl.addEventListener('click', fitToScreen);

    if (initGL()) {
      resize();
      loadCadData().catch((err) => {
        console.error('[CAD Init Error]', err);
        updateLoader(1, 'Hata Oluştu', err.message || 'Çizim başlatılamadı', 0);
      });
    }
  </script>
</body>
</html>
