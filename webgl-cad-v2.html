<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Şantiye CAD - Donanım Motoru</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-main: #000000;
      --canvas-bg: #000000;
      --hud-bg: rgba(15, 23, 42, 0.88);
      --hud-border: rgba(255, 255, 255, 0.12);
      --hud-shadow: 0 12px 32px rgba(0, 0, 0, 0.65);
      --text-primary: #f8fafc;
      --text-secondary: #94a3b8;
      --text-accent: #38bdf8;
      --primary: #2563eb;
      --btn-bg: rgba(15, 23, 42, 0.85);
      --btn-border: rgba(255, 255, 255, 0.14);
      --btn-hover: rgba(56, 189, 248, 0.2);
      --popup-bg: rgba(15, 23, 42, 0.95);
      --divider: rgba(255, 255, 255, 0.08);
      --item-hover: rgba(255, 255, 255, 0.07);
      --status-pill-bg: rgba(255, 255, 255, 0.08);
      --status-pill-color: #94a3b8;
      --accent-cyan: #00f0ff;
      --accent-green: #10b981;
      --radar-ring: rgba(56, 189, 248, 0.25);
      --radar-sweep: rgba(56, 189, 248, 0.35);
    }

    body.theme-light {
      --bg-main: #000000;
      --canvas-bg: #000000;
      --hud-bg: rgba(255, 255, 255, 0.94);
      --hud-border: rgba(226, 232, 240, 0.95);
      --hud-shadow: 0 10px 28px rgba(0, 0, 0, 0.35);
      --text-primary: #0f172a;
      --text-secondary: #64748b;
      --text-accent: #0284c7;
      --primary: #2563eb;
      --btn-bg: rgba(255, 255, 255, 0.9);
      --btn-border: rgba(203, 213, 225, 0.85);
      --btn-hover: rgba(2, 132, 199, 0.12);
      --popup-bg: rgba(255, 255, 255, 0.98);
      --divider: rgba(226, 232, 240, 0.9);
      --item-hover: rgba(241, 245, 249, 0.95);
      --status-pill-bg: rgba(241, 245, 249, 0.95);
      --status-pill-color: #64748b;
      --accent-cyan: #0284c7;
      --accent-green: #059669;
      --radar-ring: rgba(2, 132, 199, 0.25);
      --radar-sweep: rgba(2, 132, 199, 0.28);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      touch-action: none;
    }
    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      overscroll-behavior: none;
      overscroll-behavior-x: none;
      overscroll-behavior-y: none;
      -webkit-overscroll-behavior: none;
      background-color: #000000 !important;
      font-family: 'Poppins', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      color: var(--text-primary);
    }
    #canvas-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: #000000 !important;
      cursor: grab;
      touch-action: none;
      overscroll-behavior: none;
    }
    #canvas-container:active {
      cursor: grabbing;
    }
    #canvas-container.crosshair-cursor {
      cursor: crosshair !important;
    }
    canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
    }
    #glCanvas {
      z-index: 1;
    }
    #textCanvas {
      z-index: 2;
      pointer-events: none;
    }

    /* Modern Glass HUD Panel */
    .hud-panel {
      position: absolute;
      z-index: 10;
      background: var(--hud-bg);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid var(--hud-border);
      border-radius: 14px;
      color: var(--text-primary);
      box-shadow: var(--hud-shadow);
      transition: background 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease;
    }

    #project-badge {
      display: none !important;
    }

    /* Top Right Floating Actions */
    #hud-actions {
      position: absolute;
      top: 12px;
      right: 12px;
      z-index: 20;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    /* Measurement Tutorial / Info Modal */
    #measure-info-modal {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 70;
      padding: 18px 20px;
      width: 310px;
      max-width: calc(100vw - 32px);
      background: var(--popup-bg);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--hud-border);
      border-radius: 18px;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.75);
      animation: fadeInPopup 0.18s ease;
    }
    .info-modal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
    }
    .info-modal-title-group {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13.5px;
      font-weight: 700;
      color: var(--text-accent);
    }
    .info-modal-body {
      font-size: 12px;
      line-height: 1.55;
      color: var(--text-primary);
      margin-bottom: 14px;
    }
    .info-tip-row {
      display: flex;
      align-items: flex-start;
      gap: 8px;
      margin-bottom: 8px;
      font-size: 12px;
      color: var(--text-secondary);
    }
    .info-tip-icon {
      color: var(--text-accent);
      flex-shrink: 0;
      margin-top: 1px;
    }
    .info-modal-actions {
      display: flex;
      justify-content: flex-end;
    }
    .btn-info-action {
      background: linear-gradient(135deg, #0284c7, #38bdf8);
      color: #ffffff;
      border: none;
      padding: 8px 18px;
      border-radius: 10px;
      font-family: inherit;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(2, 132, 199, 0.35);
      transition: all 0.15s ease;
    }
    .btn-info-action:active {
      transform: scale(0.96);
    }

    .action-btn {
      height: 36px;
      padding: 0 13px;
      border-radius: 11px;
      background: var(--btn-bg);
      backdrop-filter: blur(12px);
      border: 1px solid var(--btn-border);
      color: var(--text-primary);
      font-family: inherit;
      font-size: 12px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 7px;
      cursor: pointer;
      transition: all 0.15s ease;
      position: relative;
      touch-action: manipulation;
    }
    .action-btn:hover {
      background: var(--btn-hover);
      border-color: var(--text-accent);
      color: var(--text-accent);
    }
    .action-btn:active {
      transform: scale(0.96);
    }
    .mode-indicator {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--accent-cyan);
      box-shadow: 0 0 8px var(--accent-cyan);
    }
    .action-btn.active-dist {
      border-color: #06b6d4 !important;
      color: #0891b2 !important;
      background: rgba(6, 182, 212, 0.18) !important;
    }
    .action-btn.active-area {
      border-color: #10b981 !important;
      color: #059669 !important;
      background: rgba(16, 185, 129, 0.18) !important;
    }

    /* Dropdown Popups (Tools & Layers) */
    #tools-popup, #layers-popup {
      position: absolute;
      top: 56px;
      right: 14px;
      width: 260px;
      max-height: calc(100vh - 120px);
      overflow-y: auto;
      padding: 8px;
      display: none;
      flex-direction: column;
      gap: 4px;
      z-index: 30;
      background: var(--popup-bg);
      backdrop-filter: blur(20px);
      border: 1px solid var(--hud-border);
      border-radius: 16px;
      box-shadow: var(--hud-shadow);
      animation: fadeInPopup 0.15s ease;
      touch-action: pan-y;
    }
    @keyframes fadeInPopup {
      from { opacity: 0; transform: translateY(-6px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .popup-title {
      font-size: 11px;
      font-weight: 700;
      color: var(--text-secondary);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      padding: 6px 8px 4px 8px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .popup-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 9px 10px;
      border-radius: 10px;
      background: transparent;
      border: none;
      color: var(--text-primary);
      font-family: inherit;
      font-size: 12.5px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.12s ease;
      width: 100%;
      text-align: left;
    }
    .popup-item:hover {
      background: var(--item-hover);
      color: var(--text-accent);
    }
    .popup-item.item-active {
      background: var(--btn-hover);
      color: var(--text-accent);
      font-weight: 600;
    }
    .popup-item .item-left {
      display: flex;
      align-items: center;
      gap: 9px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .layer-dot {
      width: 10px;
      height: 10px;
      border-radius: 3px;
      flex-shrink: 0;
      border: 1px solid rgba(255, 255, 255, 0.25);
    }
    .popup-divider {
      height: 1px;
      background: var(--divider);
      margin: 4px 6px;
    }
    .popup-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 6px 10px;
    }
    .popup-row .item-left {
      display: flex;
      align-items: center;
      gap: 9px;
      font-size: 12.5px;
      color: var(--text-primary);
      font-weight: 500;
    }
    .status-pill {
      font-size: 10px;
      font-weight: 700;
      padding: 2px 7px;
      border-radius: 6px;
      background: var(--status-pill-bg);
      color: var(--status-pill-color);
      flex-shrink: 0;
    }
    .status-pill.active-pill {
      background: rgba(56, 189, 248, 0.2);
      color: var(--text-accent);
      border: 1px solid rgba(56, 189, 248, 0.4);
    }
    .status-pill.active-pill-green {
      background: rgba(16, 185, 129, 0.2);
      color: var(--accent-green);
      border: 1px solid rgba(16, 185, 129, 0.4);
    }

    /* Scale Dropdown */
    #scale-select {
      background: var(--hud-bg);
      border: 1px solid var(--btn-border);
      color: var(--text-accent);
      border-radius: 8px;
      padding: 4px 8px;
      font-family: inherit;
      font-size: 11px;
      font-weight: 600;
      outline: none;
      cursor: pointer;
    }
    #scale-select option {
      background: var(--hud-bg);
      color: var(--text-primary);
    }

    /* Floating Measure Action Card */
    #measure-card {
      position: absolute;
      top: 56px;
      left: 14px;
      z-index: 25;
      padding: 12px 14px;
      display: none;
      flex-direction: column;
      gap: 6px;
      min-width: 220px;
      background: var(--popup-bg);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(56, 189, 248, 0.35);
      border-radius: 14px;
      box-shadow: var(--hud-shadow);
      animation: fadeInPopup 0.15s ease;
    }
    .measure-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .measure-title-group {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      font-weight: 700;
      color: var(--text-accent);
    }
    .icon-btn-sm {
      width: 24px;
      height: 24px;
      border-radius: 7px;
      background: transparent;
      border: none;
      color: var(--text-secondary);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.12s ease;
    }
    .icon-btn-sm:hover {
      background: var(--item-hover);
      color: var(--text-primary);
    }
    .measure-result-val {
      font-size: 21px;
      font-weight: 800;
      color: var(--text-primary);
      font-family: 'JetBrains Mono', monospace;
      letter-spacing: -0.5px;
    }
    .measure-sub-val {
      font-size: 11.5px;
      color: var(--text-secondary);
    }
    .measure-actions {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-top: 4px;
    }
    .btn {
      background: var(--item-hover);
      border: 1px solid var(--btn-border);
      color: var(--text-primary);
      padding: 6px 11px;
      border-radius: 8px;
      font-family: inherit;
      font-size: 11.5px;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      transition: all 0.12s ease;
    }
    .btn:hover {
      background: var(--btn-hover);
    }
    .btn-danger-soft:hover {
      background: rgba(239, 68, 68, 0.18);
      border-color: #ef4444;
      color: #ef4444;
    }

    /* Floating Navigation Controls */
    #zoom-tools {
      bottom: 24px;
      right: 20px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      z-index: 10;
    }
    .tool-btn {
      width: 40px;
      height: 40px;
      border-radius: 12px;
      background: var(--hud-bg);
      backdrop-filter: blur(10px);
      border: 1px solid var(--hud-border);
      color: var(--text-primary);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: var(--hud-shadow);
      touch-action: manipulation;
      transition: all 0.15s ease;
    }
    .tool-btn:hover {
      background: var(--btn-hover);
      color: var(--text-accent);
    }
    .tool-btn:active {
      transform: scale(0.94);
    }

    /* Bottom Coordinate Bar */
    #bottom-info {
      bottom: 24px;
      left: 20px;
      padding: 6px 14px;
      font-size: 11px;
      font-family: 'JetBrains Mono', monospace;
      color: var(--text-secondary);
      display: flex;
      align-items: center;
      gap: 12px;
      border-radius: 10px;
    }
    .status-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--accent-green);
      box-shadow: 0 0 6px var(--accent-green);
    }

    /* Precision Magnifier Loupe */
    #loupe-container {
      position: absolute;
      width: 140px;
      height: 140px;
      border-radius: 50%;
      border: 2.5px solid var(--text-accent);
      box-shadow: 0 0 20px rgba(56, 189, 248, 0.4), var(--hud-shadow);
      background: var(--bg-main);
      overflow: hidden;
      pointer-events: none;
      z-index: 50;
      display: none;
      transform: translate(-50%, -50%);
    }
    #loupeCanvas {
      width: 100%;
      height: 100%;
      display: block;
    }
    .loupe-crosshair {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 22px;
      height: 22px;
      transform: translate(-50%, -50%);
      pointer-events: none;
    }
    .loupe-crosshair::before, .loupe-crosshair::after {
      content: '';
      position: absolute;
      background: var(--accent-cyan);
      box-shadow: 0 0 4px var(--accent-cyan);
    }
    .loupe-crosshair::before {
      top: 10px;
      left: 0;
      width: 22px;
      height: 2px;
    }
    .loupe-crosshair::after {
      top: 0;
      left: 10px;
      width: 2px;
      height: 22px;
    }
    .loupe-center-dot {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 4px;
      height: 4px;
      background: #ef4444;
      border-radius: 50%;
      transform: translate(-50%, -50%);
      box-shadow: 0 0 4px #ef4444;
    }
    .loupe-snap-badge {
      position: absolute;
      bottom: 8px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(16, 185, 129, 0.92);
      color: #ffffff;
      font-size: 9px;
      font-weight: 700;
      padding: 1px 6px;
      border-radius: 4px;
      text-transform: uppercase;
      letter-spacing: 0.3px;
      display: none;
    }

    /* Customized CAD Blueprint Stage Loader */
    #loader {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 100;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      background: var(--popup-bg);
      padding: 28px 36px;
      border-radius: 20px;
      border: 1px solid var(--hud-border);
      box-shadow: var(--hud-shadow);
      text-align: center;
      width: 360px;
      max-width: calc(100vw - 32px);
      box-sizing: border-box;
      animation: fadeInPopup 0.2s ease;
    }

    .cad-radar-box {
      position: relative;
      width: 68px;
      height: 68px;
      border-radius: 50%;
      border: 1.5px solid var(--radar-ring);
      background: radial-gradient(circle, var(--radar-sweep) 0%, transparent 70%);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      flex-shrink: 0;
    }
    .cad-radar-sweep {
      position: absolute;
      width: 100%;
      height: 100%;
      background: conic-gradient(from 0deg, transparent 0deg, transparent 270deg, var(--text-accent) 360deg);
      border-radius: 50%;
      animation: radarSweep 1.6s linear infinite;
      opacity: 0.7;
    }
    @keyframes radarSweep {
      to { transform: rotate(360deg); }
    }
    .cad-radar-ring {
      position: absolute;
      border-radius: 50%;
      border: 1px dashed var(--radar-ring);
    }
    .ring-1 { width: 46px; height: 46px; }
    .ring-2 { width: 24px; height: 24px; }
    .cad-radar-cross-h {
      position: absolute;
      width: 100%;
      height: 1px;
      background: var(--radar-ring);
    }
    .cad-radar-cross-v {
      position: absolute;
      width: 1px;
      height: 100%;
      background: var(--radar-ring);
    }
    .cad-radar-center {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--text-accent);
      box-shadow: 0 0 8px var(--text-accent);
      z-index: 2;
    }

    .loader-content {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .loader-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }
    #loader-title {
      font-size: 14px;
      font-weight: 700;
      color: var(--text-primary);
      text-align: left;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .loader-percent-badge {
      font-size: 12px;
      font-weight: 700;
      font-family: 'JetBrains Mono', monospace;
      color: var(--text-accent);
      background: var(--item-hover);
      padding: 2px 7px;
      border-radius: 6px;
      flex-shrink: 0;
    }
    #loader-sub {
      font-size: 11.5px;
      color: var(--text-secondary);
      text-align: left;
      line-height: 1.4;
      min-height: 16px;
    }
    .loader-progress-track {
      width: 100%;
      height: 6px;
      border-radius: 3px;
      background: var(--item-hover);
      overflow: hidden;
      margin-top: 2px;
    }
    .loader-progress-bar {
      height: 100%;
      width: 10%;
      background: linear-gradient(90deg, #2563eb, #38bdf8);
      border-radius: 3px;
      transition: width 0.3s ease;
    }

    .loader-stages {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 6px;
      margin-top: 6px;
    }
    .stage-step {
      display: flex;
      align-items: center;
      gap: 5px;
      padding: 5px 6px;
      border-radius: 8px;
      background: var(--item-hover);
      font-size: 10px;
      font-weight: 600;
      color: var(--text-secondary);
      transition: all 0.2s ease;
      justify-content: center;
    }
    .stage-dot {
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: var(--text-secondary);
      transition: all 0.2s ease;
      flex-shrink: 0;
    }
    .stage-step.active {
      background: var(--btn-hover);
      color: var(--text-accent);
      border: 1px solid var(--text-accent);
    }
    .stage-step.active .stage-dot {
      background: var(--text-accent);
      box-shadow: 0 0 6px var(--text-accent);
      animation: pulseDot 1s infinite alternate;
    }
    .stage-step.done {
      background: rgba(16, 185, 129, 0.12);
      color: var(--accent-green);
    }
    .stage-step.done .stage-dot {
      background: var(--accent-green);
    }
    @keyframes pulseDot {
      from { transform: scale(0.9); opacity: 0.6; }
      to { transform: scale(1.3); opacity: 1; }
    }
    .cad-retry-btn {
      margin-top: 10px;
      padding: 9px 22px;
      border-radius: 11px;
      background: var(--text-accent);
      color: #ffffff;
      font-weight: 600;
      font-size: 13px;
      border: none;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(2, 132, 199, 0.35);
      transition: all 0.2s ease;
      touch-action: manipulation;
    }

    @media (max-width: 480px) {
      #tools-popup, #layers-popup {
        right: 10px;
        left: 10px;
        width: auto;
        max-width: calc(100vw - 20px);
      }
      #measure-card {
        right: 10px;
        left: 10px;
        min-width: 0;
        max-width: calc(100vw - 20px);
      }
      #loader {
        width: calc(100vw - 32px);
        padding: 22px 18px;
      }
      .loader-stages {

  <!-- Bottom Coordinate Bar -->
  <div id="bottom-info" class="hud-panel">

    <span id="coords">X: 0.00  Y: 0.00</span>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const themeParam = urlParams.get('theme');
    const isLight = themeParam === 'light' || (!themeParam && window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches);
    if (isLight) {
      document.body.classList.add('theme-light');
    }

    const glCanvas = document.getElementById('glCanvas');
    const textCanvas = document.getElementById('textCanvas');
    const container = document.getElementById('canvas-container');
    const coordsEl = document.getElementById('coords');
    const zoomLevelEl = document.getElementById('zoom-level');
    const statsEl = document.getElementById('stats');
    const loader = document.getElementById('loader');

    const loaderTitleEl = document.getElementById('loader-title');
    const loaderSubEl = document.getElementById('loader-sub');
    const loaderPercentEl = document.getElementById('loader-percent');
    const loaderProgressBar = document.getElementById('loader-progress-bar');
    const step1 = document.getElementById('step-1');
    const step2 = document.getElementById('step-2');
    const step3 = document.getElementById('step-3');
    const step4 = document.getElementById('step-4');

    function updateLoader(stepNum, title, sub, percent) {
      if (loaderTitleEl) loaderTitleEl.innerText = title;
      if (loaderSubEl) loaderSubEl.innerText = sub;
      if (loaderPercentEl) loaderPercentEl.innerText = `${percent}%`;
      if (loaderProgressBar) loaderProgressBar.style.width = `${percent}%`;

      const steps = [step1, step2, step3, step4];
      for (let i = 0; i < steps.length; i++) {
        if (!steps[i]) continue;
        if (i + 1 < stepNum) {
          steps[i].className = 'stage-step done';
        } else if (i + 1 === stepNum) {
          steps[i].className = 'stage-step active';
        } else {
          steps[i].className = 'stage-step';
        }
      }
    }

    const loupeContainer = document.getElementById('loupe-container');
    const loupeCanvas = document.getElementById('loupeCanvas');
    const loupeCtx = loupeCanvas.getContext('2d');
    const loupeSnapBadge = document.getElementById('loupeSnapBadge');

    const measureCard = document.getElementById('measure-card');
    const measureCardTitle = document.getElementById('measure-card-title');
    const measurePrimaryVal = document.getElementById('measure-primary-val');
    const measureSubVal = document.getElementById('measure-sub-val');
    const scaleSelect = document.getElementById('scale-select');

    let gl, textCtx;
    let lineProgram;
    let lineBuffer = null;
    let triangleBuffer = null;
    let totalLines = 0;
    let totalTriangles = 0;
    let showTexts = true;
    let showFills = true;
    let rawLinesArray = null;
    let loadedFromBinary = false;
    let rtcCenterX = 0.0;
    let rtcCenterY = 0.0;

    // Katman (Layer) Yönetimi
    let cadLayers = [];
    let hiddenLayers = new Set();

    // Measurement & Loupe State
    let measureMode = 'none';
    let measurePoints = [];
    let activeSnapPoint = null;
    let metersPerUnit = 0.01;

    // Camera Transformation
    let zoom = 0.006;
    let offsetX = 0.0;
    let offsetY = 0.0;
    let bounds = { minX: 0, minY: 0, w: 1000, h: 1000 };
    let cadTexts = [];

    // 60-120 FPS requestAnimationFrame Coalescing & Dynamic LOD
    let rafPending = false;
    let isInteracting = false;
    let interactionTimer = null;

    function markInteracting() {
      isInteracting = true;
      clearTimeout(interactionTimer);
      interactionTimer = setTimeout(() => {
        isInteracting = false;
        scheduleRender();
      }, 130);
    }

    function scheduleRender() {
      if (rafPending) return;
      rafPending = true;
      requestAnimationFrame(() => {
        rafPending = false;
        renderNow();
      });
    }

    // Coordinate System Configuration
    let flipY = localStorage.getItem('cad_flip_y') !== 'false';
    let swapXY = localStorage.getItem('cad_swap_xy') === 'true';

    function toProjectCoords(wx, wy) {
      let px = wx;
      let py = flipY ? ((bounds && bounds.h) ? (bounds.minY + bounds.h - wy) : -wy) : wy;
      if (swapXY) {
        return { x: py, y: px, labelX: 'Y', labelY: 'X' };
      }
      return { x: px, y: py, labelX: 'X', labelY: 'Y' };
    }

    function updateCoordsDisplay(wx, wy) {
      if (!coordsEl) return;
      const p = toProjectCoords(wx, wy);
      coordsEl.innerText = `${p.labelX}: ${p.x.toFixed(1)}  ${p.labelY}: ${p.y.toFixed(1)}`;
    }

    // Fast Spatial Hash Index for OSNAP & Text Viewport Culling
    let spatialGrid = new Map();
    let textSpatialGrid = new Map();
    const GRID_SIZE = 1200;
    const TEXT_GRID_SIZE = 2400;

    function buildTextSpatialGrid(texts) {
      textSpatialGrid.clear();
      if (!texts || !texts.length) return;
      for (let i = 0; i < texts.length; i++) {
        const item = texts[i];
        const gx = Math.floor(item.x / TEXT_GRID_SIZE);
        const gy = Math.floor(item.y / TEXT_GRID_SIZE);
        const key = `${gx}_${gy}`;
        let cell = textSpatialGrid.get(key);
        if (!cell) {
          cell = [];
          textSpatialGrid.set(key, cell);
        }
        cell.push(item);
      }
    }

    function buildSpatialGrid(lines, stride = 5) {
      if (!lines) return;
      spatialGrid.clear();
      const len = lines.length;
      for (let i = 0; i < len; i += stride) {
        const x1 = lines[i];
        const y1 = lines[i+1];
        const x2 = lines[i+2];
        const y2 = lines[i+3];

        insertPointToGrid(x1, y1, 'endpoint');
        insertPointToGrid(x2, y2, 'endpoint');

        const mx = (x1 + x2) * 0.5;
        const my = (y1 + y2) * 0.5;
        insertPointToGrid(mx, my, 'midpoint');

        insertLineToGrid(x1, y1, x2, y2, i);
      }
    }

    function addToCell(gx, gy, lineIndex) {
      const key = `${gx}_${gy}`;
      let cell = spatialGrid.get(key);
      if (!cell) {
        cell = { pts: [], lines: [] };
        spatialGrid.set(key, cell);
      }
      if (cell.lines.length < 300) {
        cell.lines.push(lineIndex);
      }
    }

    function insertPointToGrid(x, y, type) {
      const gx = Math.floor(x / GRID_SIZE);
      const gy = Math.floor(y / GRID_SIZE);
      const key = `${gx}_${gy}`;
      let cell = spatialGrid.get(key);
      if (!cell) {
        cell = { pts: [], lines: [] };
        spatialGrid.set(key, cell);
      }
      if (cell.pts.length < 300) {
        cell.pts.push({ x, y, type });
      }
    }

    function insertLineToGrid(x1, y1, x2, y2, lineIndex) {
      const minGx = Math.floor(Math.min(x1, x2) / GRID_SIZE);
      const maxGx = Math.floor(Math.max(x1, x2) / GRID_SIZE);
      const minGy = Math.floor(Math.min(y1, y2) / GRID_SIZE);
      const maxGy = Math.floor(Math.max(y1, y2) / GRID_SIZE);

      const spanX = maxGx - minGx;
      const spanY = maxGy - minGy;

      if (spanX <= 3 && spanY <= 3) {
        for (let gx = minGx; gx <= maxGx; gx++) {
          for (let gy = minGy; gy <= maxGy; gy++) {
            addToCell(gx, gy, lineIndex);
          }
        }
      } else {
        const len = Math.hypot(x2 - x1, y2 - y1);
        const steps = Math.min(Math.ceil(len / (GRID_SIZE * 0.7)), 60);
        const added = new Set();
        for (let s = 0; s <= steps; s++) {
          const t = s / steps;
          const px = x1 + t * (x2 - x1);
          const py = y1 + t * (y2 - y1);
          const gx = Math.floor(px / GRID_SIZE);
          const gy = Math.floor(py / GRID_SIZE);
          const key = `${gx}_${gy}`;
          if (!added.has(key)) {
            added.add(key);
            addToCell(gx, gy, lineIndex);
          }
        }
      }
    }

    function findNearestSnap(worldX, worldY) {
      const screenRadiusVertex = 34;
      const screenRadiusMidpoint = 28;
      const screenRadiusLine = 24;
      const maxScreenRadius = Math.max(screenRadiusVertex, screenRadiusMidpoint, screenRadiusLine);
      const maxWorldDist = maxScreenRadius / zoom;

      const minGx = Math.floor((worldX - maxWorldDist) / GRID_SIZE);
      const maxGx = Math.floor((worldX + maxWorldDist) / GRID_SIZE);
      const minGy = Math.floor((worldY - maxWorldDist) / GRID_SIZE);
      const maxGy = Math.floor((worldY + maxWorldDist) / GRID_SIZE);

      let bestVertex = null;
      let bestVertexDistSq = (screenRadiusVertex / zoom) ** 2;

      let bestMidpoint = null;
      let bestMidDistSq = (screenRadiusMidpoint / zoom) ** 2;

      let bestLineProj = null;
      let bestLineDistSq = (screenRadiusLine / zoom) ** 2;

      if (measureMode === 'area' && measurePoints.length >= 3) {
        const first = measurePoints[0];
        const dsq = (first.x - worldX) ** 2 + (first.y - worldY) ** 2;
        if (dsq < (screenRadiusVertex / zoom) ** 2) {
          return { x: first.x, y: first.y, type: 'İLK KÖŞE (ALANI KAPAT)' };
        }
      }

      const visitedLines = new Set();

      for (let gx = minGx; gx <= maxGx; gx++) {
        for (let gy = minGy; gy <= maxGy; gy++) {
          const cell = spatialGrid.get(`${gx}_${gy}`);
          if (!cell) continue;

          for (let i = 0; i < cell.pts.length; i++) {
            const p = cell.pts[i];
            const dx = p.x - worldX;
            const dy = p.y - worldY;
            const distSq = dx * dx + dy * dy;

            if (p.type === 'endpoint') {
              if (distSq < bestVertexDistSq) {
                bestVertexDistSq = distSq;
                bestVertex = { x: p.x, y: p.y, type: 'KÖŞE' };
              }
            } else if (p.type === 'midpoint') {
              if (distSq < bestMidDistSq) {
                bestMidDistSq = distSq;
                bestMidpoint = { x: p.x, y: p.y, type: 'ORTA NOKTA' };
              }
            }
          }

          if (rawLinesArray) {
            for (let j = 0; j < cell.lines.length; j++) {
              const li = cell.lines[j];
              if (visitedLines.has(li)) continue;
              visitedLines.add(li);

              const x1 = rawLinesArray[li];
              const y1 = rawLinesArray[li+1];
              const x2 = rawLinesArray[li+2];
              const y2 = rawLinesArray[li+3];

              const vx = x2 - x1;
              const vy = y2 - y1;
              const lenSq = vx * vx + vy * vy;
              if (lenSq < 0.001) continue;

              const t = Math.max(0, Math.min(1, ((worldX - x1) * vx + (worldY - y1) * vy) / lenSq));
              const projX = x1 + t * vx;
              const projY = y1 + t * vy;
              const distSq = (worldX - projX) ** 2 + (worldY - projY) ** 2;

              if (distSq < bestLineDistSq) {
                bestLineDistSq = distSq;
                bestLineProj = { x: projX, y: projY, type: 'ÇİZGİ HATTI' };
              }
            }
          }
        }
      }

      if (bestVertex) return bestVertex;
      if (bestMidpoint) return bestMidpoint;
      if (bestLineProj) return bestLineProj;

      if (measurePoints.length > 0) {
        const lastPt = measurePoints[measurePoints.length - 1];
        const screenDy = Math.abs(worldY - lastPt.y) * zoom;
        const screenDx = Math.abs(worldX - lastPt.x) * zoom;
        if (screenDy < 18) {
          return { x: worldX, y: lastPt.y, type: 'YATAY AKS (0°)' };
        } else if (screenDx < 18) {
          return { x: lastPt.x, y: worldY, type: 'DİKEY AKS (90°)' };
        }
      }

      return null;
    }

    const vsSource = `
      attribute vec2 a_pos;
      attribute vec3 a_color;
      uniform vec2 u_res;
      uniform vec2 u_offset;
      uniform float u_zoom;
      uniform float u_flip_y;
      varying vec3 v_color;
      void main() {
        vec2 d = a_pos - u_offset;
        vec2 clip = vec2(d.x, d.y * u_flip_y) * (2.0 * u_zoom / u_res);
        gl_Position = vec4(clip.x, clip.y, 0.0, 1.0);
        v_color = a_color;
      }
    `;

    const fsSource = `
      precision mediump float;
      varying vec3 v_color;
      void main() {
        gl_FragColor = vec4(v_color, 1.0);
      }
    `;

    function initGL() {
      gl = glCanvas.getContext('webgl', { antialias: true, alpha: false, powerPreference: 'high-performance' });
      if (!gl) {
        alert('WebGL bu tarayıcıda desteklenmiyor!');
        return false;
      }
      textCtx = textCanvas.getContext('2d');

      const vs = gl.createShader(gl.VERTEX_SHADER);
      gl.shaderSource(vs, vsSource);
      gl.compileShader(vs);

      const fs = gl.createShader(gl.FRAGMENT_SHADER);
      gl.shaderSource(fs, fsSource);
      gl.compileShader(fs);

      lineProgram = gl.createProgram();
      gl.attachShader(lineProgram, vs);
      gl.attachShader(lineProgram, fs);
      gl.linkProgram(lineProgram);

      gl.useProgram(lineProgram);
      gl.clearColor(0.0, 0.0, 0.0, 1.0);
      return true;
    }

    function resize() {
      const dpr = window.devicePixelRatio || 1;
      const w = window.innerWidth;
      const h = window.innerHeight;

      glCanvas.width = Math.round(w * dpr);
      glCanvas.height = Math.round(h * dpr);
      textCanvas.width = Math.round(w * dpr);
      textCanvas.height = Math.round(h * dpr);
      gl.viewport(0, 0, glCanvas.width, glCanvas.height);
      scheduleRender();
    }

    window.addEventListener('resize', resize);

    // Cihaz İçi IndexedDB Hızlı CAD Önbelleği (v=5.3 parametresinin önbelleği ezmesi düzeltildi!)
    function openCadDb() {
      return new Promise((resolve) => {
        try {
          const req = indexedDB.open('CadFastCacheDB', 1);
          req.onupgradeneeded = () => {
            const db = req.result;
            if (!db.objectStoreNames.contains('drawings')) {
              db.createObjectStore('drawings', { keyPath: 'id' });
            }
          };
          req.onsuccess = () => resolve(req.result);
          req.onerror = () => resolve(null);
        } catch (e) { resolve(null); }
      });
    }

    async function getCachedDrawing(id) {
      // Yalnızca açıkça nocache veya refresh istendiğinde önbelleği atla
      const forceRefresh = urlParams.has('nocache') || urlParams.has('refresh');
      if (forceRefresh) return null;
      try {
        const db = await openCadDb();
        if (!db) return null;
        return new Promise((resolve) => {
          const tx = db.transaction('drawings', 'readonly');
          const store = tx.objectStore('drawings');
          const req = store.get(id);
          req.onsuccess = () => {
            const res = req.result;
            if (!res || !res.v || res.v < 8 || !res.meta || !res.meta.totalLines || res.meta.totalLines <= 0) {
              resolve(null);
            } else {
              resolve(res);
            }
          };
          req.onerror = () => resolve(null);
        });
      } catch (e) { return null; }
    }

    async function setCachedDrawing(id, meta, vertexData, triVertexBuffer = null) {
      try {
        const db = await openCadDb();
        if (!db) return;
        const tx = db.transaction('drawings', 'readwrite');
        const store = tx.objectStore('drawings');
        const copyBuf = vertexData.buffer.slice(0);
        const copyTriBuf = triVertexBuffer ? triVertexBuffer.slice(0) : null;
        store.put({ id, meta, vertexBuffer: copyBuf, triBuffer: copyTriBuf, v: 8, savedAt: Date.now() });
      } catch (e) {}
    }

    function applyDetectedUnits(metaObj) {
      if (!metaObj || !metaObj.metersPerUnit) return;
      const mpu = parseFloat(metaObj.metersPerUnit);
      if (!isNaN(mpu) && mpu > 0) {
        metersPerUnit = mpu;
        if (scaleSelect) {
          for (const opt of scaleSelect.options) {
            if (Math.abs(parseFloat(opt.value) - mpu) < 1e-6) {
              scaleSelect.value = opt.value;
              break;
            }
          }
        }
      }
    }

    function populateLayersUI(layersList) {
      cadLayers = layersList || [];
      const btnLayers = document.getElementById('layers-menu-btn');
      const containerEl = document.getElementById('layers-list-container');
      if (!btnLayers || !containerEl) return;
