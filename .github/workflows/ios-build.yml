name: Build iOS IPA (No Mac Needed)

on:
  workflow_dispatch: # GitHub arayüzünden "Run workflow" butonuna basarak elle başlatabilmek için
  push:
    branches: [ main ]
    paths:
      - 'lib/**'
      - 'ios/**'
      - 'pubspec.yaml'
      - '.github/workflows/ios-build.yml'

jobs:
  build-ios:
    name: Build iOS (IPA)
    runs-on: macos-15 # Apple Silicon macOS Sequoia & En Güncel Xcode 16

    steps:
      - name: Kodu Klonla
        uses: actions/checkout@v4

      - name: Git Güvenli Dizin Yapılandırması
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Java Kurulumu (Gerekiyorsa)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Flutter Ortamını Hazırla
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Flutter Sürümü ve Doctor Kontrolü
        run: |
          xcodebuild -version
          flutter --version
          flutter doctor

      - name: Bağımlılıkları İndir (flutter pub get)
        run: |
          flutter config --no-enable-swift-package-manager
          flutter pub get
          flutter pub upgrade google_fonts

      - name: CocoaPods Önbelleği (Cache)
        uses: actions/cache@v4
        with:
          path: |
            ios/Pods
            ~/Library/Caches/CocoaPods
          key: ${{ runner.os }}-pods-${{ hashFiles('ios/Podfile') }}-${{ hashFiles('pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pods-

      - name: Flutter iOS Hazırlığı (Dart & Frameworks)
        run: |
          flutter build ios --config-only --release --no-codesign

      - name: CocoaPods Bağımlılıklarını Kur
        run: |
          cd ios
          pod install
          cd ..

      - name: Xcode ile Hızlı & İmzasız IPA Derlemesi (xcodebuild)
        run: |
          xcodebuild -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/ios_build \
            COMPILER_INDEX_STORE_ENABLE=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" \
            build

      - name: IPA Paketini Oluştur (Payload -> .ipa)
        run: |
          APP_PATH=$(find build/ios_build/Build/Products -name "Runner.app" -type d | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "HATA: Runner.app derleme klasöründe bulunamadı!"
            find build -name "*.app"
            exit 1
          fi
          echo "Bulunan uygulama yolu: $APP_PATH"
          mkdir -p build/ipa_out/Payload
          cp -R "$APP_PATH" build/ipa_out/Payload/
          cd build/ipa_out
          zip -qry SantiyePuantajDefteri.ipa Payload
          echo "Oluşturulan IPA boyutu:"
          ls -lh SantiyePuantajDefteri.ipa

      - name: IPA Dosyasını GitHub Artifacts Olarak Yükle
        uses: actions/upload-artifact@v4
        with:
          name: SantiyePuantajDefteri-iOS-IPA
          path: build/ipa_out/SantiyePuantajDefteri.ipa
          retention-days: 14
