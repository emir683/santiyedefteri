name: Build & Deploy iOS to TestFlight

on:
  workflow_dispatch: # GitHub arayüzünden "Run workflow" butonuyla elle başlatabilmek için
  push:
    branches: [ main ]
    paths:
      - 'lib/**'
      - 'ios/**'
      - 'pubspec.yaml'
      - '.github/workflows/ios-build.yml'

jobs:
  deploy-testflight:
    name: Build & Upload to TestFlight
    runs-on: macos-15 # Apple Silicon macOS Sequoia & En Güncel Xcode 16

    steps:
      - name: Kodu Klonla
        uses: actions/checkout@v4

      - name: Git Güvenli Dizin Yapılandırması
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Apple Dağıtım Sertifikası ve Profilini Kur (Keychain)
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}
        run: |
          CERTIFICATE_PATH="$RUNNER_TEMP/build_certificate.p12"
          PP_PATH="$RUNNER_TEMP/build_pp.mobileprovision"
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"
          KEYCHAIN_PASSWORD="emrcoretempkeychain987"

          # 1. Base64'ten çöz ve diske yaz (Python ile macOS BSD uyumlu)
          python3 -c "
          import base64, os
          with open('$CERTIFICATE_PATH', 'wb') as f:
              f.write(base64.b64decode(os.environ['BUILD_CERTIFICATE_BASE64'].strip()))
          with open('$PP_PATH', 'wb') as f:
              f.write(base64.b64decode(os.environ['BUILD_PROVISION_PROFILE_BASE64'].strip()))
          print('Sertifika ve Profil dosyalari basariyla cozuldu.')
          "

          # 2. Gecici Keychain olustur
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          # 3. P12 Sertifikasini Keychain'e aktar
          security import "$CERTIFICATE_PATH" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | sed -e 's/^[ \t]*//' | tr -d '"')

          # 4. Provisioning Profile'in UUID'sini bul ve Xcode sistem klasorune kaydet
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          python3 -c "
          import plistlib, subprocess, os, shutil
          output = subprocess.check_output(['security', 'cms', '-D', '-i', '$PP_PATH'])
          plist = plistlib.loads(output)
          uuid = plist['UUID']
          target = os.path.expanduser(f'~/Library/MobileDevice/Provisioning Profiles/{uuid}.mobileprovision')
          shutil.copyfile('$PP_PATH', target)
          print(f'Provisioning Profile UUID ile yuklendi: {uuid}.mobileprovision')
          "

      - name: Java Kurulumu (Gerekiyorsa)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Flutter Ortamını Hazırla
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Flutter Sürümü ve Doctor Kontrolü
        run: |
          xcodebuild -version
          flutter --version
          flutter doctor

      - name: Bağımlılıkları İndir (flutter pub get)
        run: |
          flutter config --no-enable-swift-package-manager
          flutter pub get
          flutter pub upgrade google_fonts

      - name: CocoaPods Önbelleği (Cache)
        uses: actions/cache@v4
        with:
          path: |
            ios/Pods
            ~/Library/Caches/CocoaPods
          key: ${{ runner.os }}-pods-${{ hashFiles('ios/Podfile') }}-${{ hashFiles('pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pods-

      - name: Flutter iOS Hazırlığı (Build Number Artırımı)
        run: |
          flutter build ios --config-only --release --build-number=${{ github.run_number }}

      - name: CocoaPods Bağımlılıklarını Kur
        run: |
          cd ios
          pod install
          cd ..

      - name: Xcode ile Resmi İmzalı Arşiv Oluştur (Archive)
        run: |
          xcodebuild -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath build/Runner.xcarchive \
            DEVELOPMENT_TEAM=QML2RQ244F \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            PROVISIONING_PROFILE_SPECIFIER="SantiyePuantajDefteri_AppStore" \
            CODE_SIGNING_REQUIRED=YES \
            CODE_SIGNING_ALLOWED=YES \
            COMPILER_INDEX_STORE_ENABLE=NO \
            archive

      - name: İmzalı IPA Paketini Dışa Aktar (Export Archive)
        run: |
          xcodebuild -exportArchive \
            -archivePath build/Runner.xcarchive \
            -exportOptionsPlist ios/ExportOptions.plist \
            -exportPath build/ipa_out

          echo "Oluşturulan IPA dosyaları:"
          ls -lh build/ipa_out

      - name: İmzalı IPA Dosyasını GitHub Artifacts Olarak Kaydet
        uses: actions/upload-artifact@v4
        with:
          name: SantiyePuantajDefteri-Signed-IPA
          path: build/ipa_out/*.ipa
          retention-days: 14

      - name: TestFlight'a Otomatik Yükle (App Store Connect)
        uses: apple-actions/upload-testflight-build@v5
        with:
          app-path: 'build/ipa_out/Runner.ipa'
          issuer-id: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          api-key-id: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          api-private-key: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
