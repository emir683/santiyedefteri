<!DOCTYPE html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Şantiye Puantaj Defteri</title>
    <style>
      :root {
        color-scheme: dark;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background:
          radial-gradient(circle at top, rgba(20, 184, 166, 0.18), transparent 40%),
          linear-gradient(180deg, #05070b 0%, #0c1219 100%);
        font-family: Arial, sans-serif;
        color: #f4f7fb;
      }

      .card {
        width: min(92vw, 420px);
        padding: 28px;
        border-radius: 24px;
        background: rgba(9, 14, 20, 0.82);
        border: 1px solid rgba(255, 255, 255, 0.12);
        box-shadow: 0 24px 50px rgba(0, 0, 0, 0.28);
      }

      h1 {
        margin: 0 0 12px;
        font-size: 28px;
      }

      p {
        margin: 0 0 14px;
        line-height: 1.5;
        color: rgba(244, 247, 251, 0.78);
      }

      a {
        display: inline-block;
        margin-top: 10px;
        padding: 14px 18px;
        border-radius: 14px;
        background: #14b8a6;
        color: #ffffff;
        text-decoration: none;
        font-weight: 700;
      }
    </style>
    <script>
      function getParam(name) {
        const url = new URL(window.location.href);
        return url.searchParams.get(name) || "";
      }

      function openApp() {
        const ad = encodeURIComponent(getParam("ad"));
        const ekipId = encodeURIComponent(getParam("id") || getParam("ekipId"));
        const sifre = encodeURIComponent(getParam("sifre"));

        const customScheme = ekipId
          ? `santiyeapp://katil?ad=${ad}&id=${ekipId}`
          : `santiyeapp://katil?ad=${ad}&sifre=${sifre}`;

        window.location.href = customScheme;

        setTimeout(() => {
          window.location.href =
            "https://play.google.com/store/apps/details?id=com.emircf.santiyepuantaj";
        }, 1500);
      }

      window.onload = openApp;
    </script>
  </head>
  <body>
    <div class="card">
      <h1>Şantiye Puantaj Defteri</h1>
      <p>Uygulama açılıyor. Yüklü değilse birazdan mağaza sayfasına yönlendirileceksin.</p>
      <a href="https://play.google.com/store/apps/details?id=com.emircf.santiyepuantaj">
        Uygulamayı indir
      </a>
    </div>
  </body>
</html>
