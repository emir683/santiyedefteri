name: santiyeyonetim2
description: "A new Flutter project."
publish_to: 'none'

version: 4.0.0+28

environment:
  sdk: '>=3.7.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  table_calendar: ^3.1.1
  intl: ^0.20.2
  path_provider: ^2.1.3
  json_annotation: ^4.9.0
  shared_preferences: ^2.2.3
  provider: ^6.1.2
  pdf: ^3.11.3
  printing: ^5.14.2
  share_plus: ^7.2.2
  google_fonts: ^6.2.1
  firebase_core: ^3.0.0
  firebase_auth: ^5.0.0
  cloud_firestore: ^5.0.0
  firebase_messaging: ^15.0.0
  firebase_remote_config: ^5.0.0
  google_sign_in: ^6.0.0
  tutorial_coach_mark: ^1.2.11
  liquid_glass_widgets: ^0.4.0-dev.4
  app_links: ^6.4.1
  home_widget: ^0.7.0

  # BİLDİRİM PAKETLERİ
  flutter_local_notifications_plus: ^17.2.5
  timezone: ^0.9.2
  permission_handler: ^11.3.1
  package_info_plus: ^9.0.1
  url_launcher: ^6.3.1
  connectivity_plus: ^6.0.3
  fl_chart: ^0.68.0
  speech_to_text: ^7.0.0
  audioplayers: ^6.0.0
  http: ^1.2.1
  dio: ^5.4.0
  test: ^1.26.2
  flutter_tts: ^4.2.5

  liquid_glass_renderer: any
  webview_flutter: ^4.13.1
  webview_flutter_android: ^4.12.0
  file_picker: ^11.0.3
dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_launcher_icons: ^0.14.4
  build_runner: ^2.4.9
  json_serializable: ^6.8.0
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  config:
    enable-swift-package-manager: false

  assets:
    - assets/logo.png
    - assets/fonts/
    - assets/google_logo.png
    - assets/audio/
    - assets/yerel_cad/
  fonts:
    - family: Roboto
      fonts:
        - asset: assets/fonts/Roboto-Regular.ttf

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  web:
    generate: true
    image_path: "assets/logo.png"
    background_color: "#0F7C86"
    theme_color: "#0F7C86"
  image_path: "assets/logo.png"
  min_sdk_android: 21
